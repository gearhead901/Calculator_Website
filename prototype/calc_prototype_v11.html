<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calc Workshop — prototype v11</title>
<!--
  Calc Workshop — prototype v11  (v2 Chain & Belt C-C; v3 Mechanism Ratio; v4 the rest of the ambcalc.com set;
                                 v5 regroups the menu and splits Beam Bending into a Beams & Columns group with Column Buckling;
                                 v6 puts Power Transmission first, removes discontinued VEXpro parts and the Falcon 500,
                                 and swaps VersaPlanetary for WCP PlanetaryX;
                                 v7 adds the Bolted Joint calculator — its math is the BOLTED JOINT CORE block,
                                 tested by tests/run_bolted_joint_tests.py;
                                 v8 adds a max fire rate (ball-to-ball collision limit) to the Projectile calculator;
                                 v9 adds backspin lift (Magnus) to Shot Trajectory, with its own on/off switch in both shooter calculators;
                                 v10 adds the Arm calculator: Mechanism Startup's motor model with cos-θ gravity and gear-stage inertia;
                                 v11 splits Arm into Step 1 (ratio search for holding current) and Step 2 (refine with real stages))
  ----------------------------------------------------------------
  One self-contained file: open it in any browser, no build step.
  Layout:   top bar (units / copy link / reset) + left menu + calculator page.
  Code map (search for these headings):
    1. UNITS        – how values are stored (always metric "base" units) and displayed
    2. STATE + URL  – what the page remembers, and how Copy Link works
    3. PLOT HELPERS – tiny canvas plotting helpers (no chart library)
    4. CALCULATORS  – each calculator is one object: inputs, compute(), renderOut(), docs
    5. PAGE         – builds the menu, form and page, wires up events
-->
<style>
  :root{
    --bg:#f6f5f0; --card:#ffffff; --ink:#1c1e22; --muted:#6b6f76; --line:#e4e2da;
    --accent:#2f9c90; --accent-soft:#e3f2ef;
    --panel:#222a38; --panel-ink:#c9d1de; --grid:#344055;
    --green:#4cc38a; --red:#e5534b; --blue:#4f8df5; --purple:#a77bf3; --orange:#f0a43a;
    --warn-bg:#fff6e5; --warn-ink:#8a5a00;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif}
  button,input,select{font:inherit;color:inherit}

  /* ---------- top bar ---------- */
  .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;height:56px;padding:0 18px;
    background:rgba(246,245,240,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .brand{font-weight:800;letter-spacing:-.02em;font-size:18px;display:flex;align-items:center;gap:8px}
  .brand .dot{width:12px;height:12px;border-radius:3px;background:var(--accent)}
  .brand small{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.04em}
  .spacer{flex:1}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
  .seg button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--muted)}
  .seg button.on{background:var(--ink);color:#fff}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer}
  .btn:hover{border-color:#cfccc0}
  .btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ---------- layout ---------- */
  .layout{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 56px)}
  .sidebar{border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
  .sidebar h4{margin:16px 10px 6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .sidebar h4:first-child{margin-top:0}
  .navitem{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;
    padding:7px 10px;border-radius:7px;cursor:pointer}
  .navitem:hover{background:#ecebe4}
  .navitem.on{background:var(--accent-soft);color:#17695f;font-weight:600}
  .navitem[disabled]{color:#a9aaa6;cursor:default;background:none}
  .navitem .soon{font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:0 5px}
  main{padding:28px 32px 60px;min-width:0;max-width:1280px}

  /* ---------- page header ---------- */
  .eyebrow{color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
  h1{font-size:44px;line-height:1.05;letter-spacing:-.035em;margin:6px 0 8px;font-weight:800}
  .lede{color:var(--muted);font-size:17px;max-width:720px;margin:0 0 22px}

  /* ---------- calculator body ---------- */
  .calc{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .form .sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
  .form .sec:first-child{margin-top:0;padding-top:0;border-top:0}
  .field{display:grid;grid-template-columns:1fr 128px;align-items:center;gap:8px;margin:6px 0}
  .field label{font-size:14px}
  .field .help{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-4px}
  .inbox{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;background:#fbfbf9;overflow:hidden}
  .inbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .inbox input,.inbox select{border:0;background:none;padding:6px 8px;width:100%;min-width:0;outline:none}
  .inbox .unit{padding:0 8px;color:var(--muted);font-size:12px;white-space:nowrap}
  .field.check{grid-template-columns:auto 1fr}
  .field.check input{width:16px;height:16px;accent-color:var(--accent)}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .tile .k{font-size:12px;color:var(--muted)}
  .tile .v{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .tile.primary{background:var(--ink);border-color:var(--ink);color:#fff}
  .tile.primary .k{color:#b8bcc4}
  figure.panel .tile:not(.primary){color:var(--ink)}   /* light tiles inside a dark panel keep dark text */
  .warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:14px}
  /* safety-factor rows (bolted joint): three tiles side by side, each marked pass / fail */
  .fhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin:4px 0 6px}
  .fhead b{font-size:13px;letter-spacing:.04em;text-transform:uppercase}
  .fhead span{font-size:12px;color:var(--muted)}
  .factors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
  .tile .st{font-size:12px;font-weight:600;margin-top:2px}
  .tile.ok .st{color:#23845a}
  .tile.fail{border:2px solid var(--red);background:#fdecea;padding:11px 13px}
  .tile.fail .v,.tile.fail .st{color:#c4322a}
  .tile.na .st{color:var(--muted)}
  .tile.sel{box-shadow:inset 0 0 0 2px var(--accent)}
  .tile.fail.sel{box-shadow:none}
  .verdict{border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:14px;font-weight:600}
  .verdict.fail{background:#fdecea;color:#c4322a;border:1px solid var(--red)}
  .verdict.ok{background:#e6f5ee;color:#1f7a52}

  .panels{display:grid;gap:12px}
  .panels.two{grid-template-columns:1fr 1fr}
  .panels.shot{grid-template-columns:1.7fr 1fr}
  figure.panel{margin:0;background:var(--panel);border-radius:12px;padding:10px 12px 12px;color:var(--panel-ink);min-width:0}
  figure.panel figcaption{font-size:12px;letter-spacing:.06em;color:#9aa6b8;margin-bottom:6px}
  figure.panel svg{display:block;width:100%;height:240px}
  figure.panel canvas{display:block;width:100%;height:340px}
  .readout{background:#151b26;border-radius:8px;padding:10px 12px;margin-top:10px;font-size:13px;line-height:1.7;font-variant-numeric:tabular-nums}
  .readout b{font-weight:600}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#9aa6b8;margin-top:8px}
  .legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

  details.adv{margin-top:14px}
  details.adv summary{cursor:pointer;font-weight:600}
  table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{font-size:12px;color:var(--muted);font-weight:600}
  td.mono,code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
  .pass{color:#17803d;font-weight:600}.fail{color:#c0392b;font-weight:600}

  /* ---------- docs ---------- */
  .docs{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .docs h3{margin:0 0 8px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .docs .eq{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:#f3f2ec;border-radius:8px;padding:10px 12px;line-height:1.8;white-space:pre-wrap}
  .docs p,.docs li{font-size:14px}
  .docs ul{padding-left:18px}
  footer{color:var(--muted);font-size:12px;margin-top:40px}

  table.dark th{color:#9aa6b8;border-color:#344055} table.dark td{border-color:#344055;color:#c9d1de}
  table.dark tr.now td{color:#fff;font-weight:700;background:rgba(79,141,245,.18)}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;transition:.2s;
    background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:14px;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%)}

  /* ---------- small screens ---------- */
  @media (max-width:1100px){ .calc{grid-template-columns:1fr} .panels.shot{grid-template-columns:1fr} }
  @media (max-width:820px){
    .layout{grid-template-columns:1fr}
    .sidebar{position:static;height:auto;display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px}
    .sidebar h4{display:none}
    .navitem{width:auto;white-space:nowrap}
    .navitem[disabled]{display:none}
    main{padding:20px 16px 48px}
    h1{font-size:32px}
    .panels.two,.docs{grid-template-columns:1fr}
    .brand small{display:none}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span>Calc Workshop <small>PROTOTYPE v11</small></div>
  <div class="spacer"></div>
  <div class="seg" id="unitSeg">
    <button data-u="imperial">Imperial</button><button data-u="metric">Metric</button>
  </div>
  <button class="btn" id="copyBtn" title="Copy a link with every input filled in">Copy link</button>
  <button class="btn" id="resetBtn" title="Put this calculator back to its defaults">Reset</button>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="main"></main>
</div>
<div id="toast"></div>

<script>
/* =================================================================
   1. UNITS
   Every value is STORED in metric base units (mm, m, m/s, kg).
   We only convert when SHOWING a number or READING what you typed.
   Each kind: [label, factor-to-base, decimals]
   ================================================================= */
const KINDS = {
  lenS:  { metric:['mm',1,2],     imperial:['in',25.4,4] },        // small lengths (sheet metal, wheels)
  len:   { metric:['m',1,3],      imperial:['ft',0.3048,3] },      // field distances
  speed: { metric:['m/s',1,2],    imperial:['ft/s',0.3048,2] },
  mass:  { metric:['kg',1,3],     imperial:['lb',0.45359237,3] },
  deg:   { metric:['°',1,1],      imperial:['°',1,1] },
  rpm:   { metric:['rpm',1,0],    imperial:['rpm',1,0] },
  pct:   { metric:['%',1,0],      imperial:['%',1,0] },
  teeth: { metric:['T',1,0],      imperial:['T',1,0] },
  none:  { metric:['',1,3],       imperial:['',1,3] },
  s:     { metric:['s',1,3],      imperial:['s',1,3] },
  torque:{ metric:['N·m',1,3],    imperial:['in·lb',0.112984829,2] },
  amp:   { metric:['A',1,1],      imperial:['A',1,1] },
  volt:  { metric:['V',1,1],      imperial:['V',1,1] },
  count: { metric:['',1,0],       imperial:['',1,0] },
  ratio: { metric:[': 1',1,2],    imperial:[': 1',1,2] },
  force: { metric:['N',1,1],      imperial:['lbf',4.4482216,2] },
  gpa:   { metric:['GPa',1,1],    imperial:['GPa',1,1] },
  dens:  { metric:['g/cm³',1,3],  imperial:['lb/in³',27.679905,4] },
  mohm:  { metric:['mΩ',1,1],     imperial:['mΩ',1,1] },
  vps:   { metric:['V/s',1,0],    imperial:['V/s',1,0] },
  ms:    { metric:['ms',1,2],     imperial:['ms',1,2] },
  area:  { metric:['mm²',1,1],    imperial:['in²',645.16,4] },
  inertia:{ metric:['mm⁴',1,0],   imperial:['in⁴',416231.43,5] },
  watt:  { metric:['W',1,0],      imperial:['W',1,0] },
  mpa:   { metric:['MPa',1,1],    imperial:['ksi',6.8947573,2] },
  emod:  { metric:['GPa',1,1],    imperial:['Mpsi',6.894757,2] },     // Young's modulus
  kforce:{ metric:['kN',1000,2],  imperial:['kip',4448.2216,3] },     // bolt-size forces
  stiff: { metric:['kN/mm',1000,1], imperial:['Mlbf/in',175126.835,2] }, // stiffness (base N/mm)
  moi:   { metric:['kg·cm²',1e-4,3], imperial:['lb·in²',2.9263965e-4,3] }, // mass moment of inertia (base kg·m²)
};
const U       = k => KINDS[k][state.units];
const toDisp  = (v,k) => v / U(k)[1];
const toBase  = (v,k) => v * U(k)[1];
const round   = (x,d) => Number.isFinite(x) ? Number(x.toFixed(d)) : x;
const fmtNum  = (x,d) => Number.isFinite(x) ? x.toFixed(d) : '—';
const fmtK    = (v,k,extra=0) => `${fmtNum(toDisp(v,k), U(k)[2]+extra)} ${U(k)[0]}`.trim();
const fmtSign = (v,k) => (v>=0?'+':'−') + fmtNum(Math.abs(toDisp(v,k)), U(k)[2]);

/* =================================================================
   2. STATE + URL
   state.values[calcId][inputKey] = value in base units.
   The URL hash mirrors the state, so "Copy link" just copies the URL.
   ================================================================= */
const state = { calc:'bend', units:'imperial', values:{} };

function defaultsFor(calc){
  const v = {};
  calc.inputs.forEach(i => { if (i.key) v[i.key] = i.def; });
  return v;
}
function writeHash(){
  const q = new URLSearchParams({ c: state.calc, u: state.units });
  const vals = state.values[state.calc];
  for (const [k,v] of Object.entries(vals)){
    q.set(k, typeof v === 'boolean' ? (v?'1':'0') : typeof v === 'number' ? String(+v.toPrecision(7)) : v);
  }
  history.replaceState(null, '', '#' + q.toString());
}
function readHash(){
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.get('u') === 'metric' || q.get('u') === 'imperial') state.units = q.get('u');
  const calc = CALCS.find(c => c.id === q.get('c'));
  if (!calc) return;
  state.calc = calc.id;
  const vals = state.values[calc.id];
  calc.inputs.forEach(i => {
    if (!i.key || !q.has(i.key)) return;
    const raw = q.get(i.key);
    if (i.type === 'check') vals[i.key] = raw === '1';
    else if (i.type === 'select') vals[i.key] = raw;
    else if (Number.isFinite(parseFloat(raw))) vals[i.key] = parseFloat(raw);
  });
}

/* =================================================================
   3. PLOT HELPERS (canvas)
   frame() draws the dark panel + grid and returns X()/Y() functions
   that turn base-unit values into pixel positions.
   ================================================================= */
const COL = {
  panel:'#222a38', grid:'#344055', axis:'#8794a8', text:'#9aa6b8',
  green:'#4cc38a', red:'#e5534b', blue:'#4f8df5', purple:'#a77bf3', orange:'#f0a43a', white:'#e9edf3'
};
function niceTicks(a, b, n=6){
  const span = b - a; if (!(span > 0)) return [a];
  const raw = span / n, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1,2,2.5,5,10].map(f => f*mag).find(s => span/s <= n) || 10*mag;
  const out = []; for (let t = Math.ceil(a/step)*step; t <= b + 1e-9; t += step) out.push(+t.toFixed(10));
  return out;
}
// Log-axis ticks: 1, 2, 5 × every power of ten inside [a, b]
function logTicks(a, b){
  const out = [];
  for (let e = Math.floor(Math.log10(a)); e <= Math.ceil(Math.log10(b)); e++)
    [1,2,5].forEach(f => { const t = f * 10**e; if (t >= a*(1-1e-9) && t <= b*(1+1e-9)) out.push(+t.toPrecision(6)); });
  return out;
}
function frame(cv, xr, yr, xKind, yKind, xLabel, yLabel, opts = {}){
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  const c = cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  const m = { l:48, r:12, t:12, b:38 };
  c.fillStyle = COL.panel; c.fillRect(0,0,W,H);
  // opts.xlog = true gives a logarithmic x axis (used for gear-ratio sweeps)
  const X = opts.xlog
    ? v => m.l + Math.log(v/xr[0]) / Math.log(xr[1]/xr[0]) * (W - m.l - m.r)
    : v => m.l + (v - xr[0]) / (xr[1]-xr[0]) * (W - m.l - m.r);
  const Y = v => H - m.b - (v - yr[0]) / (yr[1]-yr[0]) * (H - m.t - m.b);
  c.font = '11px -apple-system,Segoe UI,sans-serif'; c.lineWidth = 1;
  // grid lines are placed at "nice" numbers in DISPLAY units, then mapped back to base units
  const fx = xKind ? U(xKind)[1] : 1, fy = yKind ? U(yKind)[1] : 1;
  (opts.xlog ? logTicks(xr[0]/fx, xr[1]/fx) : niceTicks(xr[0]/fx, xr[1]/fx)).forEach(t => {
    const px = X(t*fx); c.strokeStyle = COL.grid; c.beginPath(); c.moveTo(px, m.t); c.lineTo(px, H-m.b); c.stroke();
    c.fillStyle = COL.text; c.textAlign = 'center'; c.fillText(String(t), px, H - m.b + 14);
  });
  niceTicks(yr[0]/fy, yr[1]/fy, 5).forEach(t => {
    const py = Y(t*fy); c.strokeStyle = COL.grid; c.beginPath(); c.moveTo(m.l, py); c.lineTo(W-m.r, py); c.stroke();
    c.fillStyle = COL.text; c.textAlign = 'right'; c.fillText(String(t), m.l - 6, py + 4);
  });
  c.fillStyle = COL.text; c.textAlign = 'center';
  c.fillText(xLabel, m.l + (W-m.l-m.r)/2, H - 6);
  c.save(); c.translate(12, m.t + (H-m.t-m.b)/2); c.rotate(-Math.PI/2); c.fillText(yLabel, 0, 0); c.restore();
  return { c, X, Y, W, H, m };
}
function polyline(c, pts, X, Y){
  c.beginPath(); pts.forEach((p,i) => i ? c.lineTo(X(p[0]), Y(p[1])) : c.moveTo(X(p[0]), Y(p[1]))); c.stroke();
}
function star(c, x, y, r){
  c.beginPath();
  for (let i=0;i<10;i++){ const a = -Math.PI/2 + i*Math.PI/5, rr = i%2 ? r*0.45 : r; c.lineTo(x+rr*Math.cos(a), y+rr*Math.sin(a)); }
  c.closePath(); c.fill(); c.stroke();
}
const tile = (k, v, cls='') => `<div class="tile ${cls}"><div class="k">${k}</div><div class="v">${v}</div></div>`;
const warnBox = ws => ws.map(w => `<div class="warn">⚠ ${w}</div>`).join('');
const legend = items => `<div class="legend">${items.map(([label,col,dash]) => `<span><i style="background:${col}${dash ? ';opacity:.6' : ''}"></i>${label}</span>`).join('')}</div>`;
// Draw several series on one frame: series = [{ pts:[[x,y]...], col, w, dash }]
function drawSeries(f, series){
  series.forEach(s => {
    f.c.strokeStyle = s.col; f.c.lineWidth = s.w || 2; f.c.setLineDash(s.dash ? [6,4] : []);
    // break the line wherever y is not a number (e.g. a motor past its limit)
    let run = [];
    const flush = () => { if (run.length > 1) polyline(f.c, run, f.X, f.Y); run = []; };
    s.pts.forEach(p => Number.isFinite(p[1]) ? run.push(p) : flush()); flush();
  });
  f.c.setLineDash([]);
}
function vline(f, x, col, y0, y1){
  f.c.strokeStyle = col; f.c.lineWidth = 1.5; f.c.setLineDash([5,4]);
  f.c.beginPath(); f.c.moveTo(f.X(x), f.Y(y0)); f.c.lineTo(f.X(x), f.Y(y1)); f.c.stroke(); f.c.setLineDash([]);
}
const range = arr => { const f = arr.filter(Number.isFinite); return f.length ? [Math.min(...f), Math.max(...f)] : [0, 1]; };
// Buttons that jump to another calculator with some inputs pre-filled (like ambcalc's "copy to ..." buttons)
const gotoBtn = (calc, vals, label) => `<button class="btn" data-goto="${calc}" data-vals='${JSON.stringify(vals)}'>${label}</button>`;

/* =================================================================
   4. CALCULATORS
   Each calculator = { id, group, title, lede, inputs[], compute(v), renderOut(el,v,r), docs() }
   compute() is pure math on base units — easy to test on its own.
   ================================================================= */

/* ---------- 4a. Sheet metal bend ---------- */
const MATERIALS = {
  // Starting K-factors only — real values come from your shop / vendor test bends.
  al5052: { label:'Aluminum 5052-H32', k:0.43 },
  al6061: { label:'Aluminum 6061-T6',  k:0.45 },
  steel:  { label:'Mild steel (CRS)',  k:0.44 },
  ss304:  { label:'Stainless 304',     k:0.45 },
  custom: { label:'Custom',            k:0.44 },
};
const BEND = {
  id:'bend', group:'Fabrication', title:'Sheet Metal Bend',
  lede:'Flat length, bend-line placement, bend allowance and bend deduction for a single bend. Flange lengths are outside (mold-line) dimensions.',
  inputs:[
    {section:'Material'},
    {key:'material', label:'Material', type:'select', def:'al5052',
      options:Object.entries(MATERIALS).map(([v,m]) => ({value:v, label:m.label}))},
    {key:'thickness', label:'Thickness (T)', kind:'lenS', def:3.175},
    {key:'k', label:'K-factor', kind:'none', def:0.43, help:'Where the neutral axis sits, as a fraction of T from the inside.'},
    {section:'Bend'},
    {key:'radius', label:'Inside radius (R)', kind:'lenS', def:3.175},
    {key:'angle', label:'Bend angle (θ)', kind:'deg', def:90, help:'How far the flange is bent: 90° makes an L.'},
    {section:'Part'},
    {key:'flangeA', label:'Flange A (outside)', kind:'lenS', def:50.8},
    {key:'flangeB', label:'Flange B (outside)', kind:'lenS', def:25.4},
    {key:'width', label:'Part width', kind:'lenS', def:76.2},
  ],
  onChange(key, v){ if (key === 'material' && v.material !== 'custom') v.k = MATERIALS[v.material].k; },
  compute(v){
    const T = v.thickness, R = v.radius, K = v.k, th = v.angle * Math.PI/180;
    const BA   = th * (R + K*T);                 // arc length of the neutral axis
    const OSSB = Math.tan(th/2) * (R + T);       // outside setback: tangent point → mold-line corner
    const BD   = 2*OSSB - BA;                    // how much shorter the flat is than A + B
    const flat = v.flangeA + v.flangeB - BD;
    const bendStart  = v.flangeA - OSSB;         // measured from the flange-A edge of the flat
    const bendCenter = bendStart + BA/2;
    const bendEnd    = bendStart + BA;
    const warnings = [];
    if (!(v.angle > 0 && v.angle < 180)) warnings.push('Bend angle must be between 0° and 180°.');
    if (bendStart <= 0) warnings.push('Flange A is shorter than the outside setback — the bend would start past the edge.');
    if (v.flangeB - OSSB <= 0) warnings.push('Flange B is shorter than the outside setback.');
    if (R < 0.5*T) warnings.push('Inside radius is under half the thickness — check your tooling and material can do this.');
    if (K < 0.2 || K > 0.5) warnings.push('K-factor is usually between about 0.3 and 0.5.');
    return { T, R, K, th, BA, OSSB, BD, flat, bendStart, bendCenter, bendEnd, warnings };
  },
  renderOut(el, v, r){
    const rows = [
      ['Outside setback (OSSB)', `tan(θ/2)·(R+T) = tan(${fmtNum(v.angle/2,1)}°)·(${fmtK(r.R,'lenS')} + ${fmtK(r.T,'lenS')})`, fmtK(r.OSSB,'lenS')],
      ['Neutral axis offset', `K·T = ${fmtNum(r.K,3)} · ${fmtK(r.T,'lenS')}`, fmtK(r.K*r.T,'lenS')],
      ['Bend allowance (BA)', `θ·(R + K·T) = ${fmtNum(r.th,4)} rad · ${fmtK(r.R + r.K*r.T,'lenS')}`, fmtK(r.BA,'lenS')],
      ['Bend deduction (BD)', `2·OSSB − BA`, fmtK(r.BD,'lenS')],
      ['Flat length', `A + B − BD`, fmtK(r.flat,'lenS')],
      ['Bend zone starts', `A − OSSB (from edge A)`, fmtK(r.bendStart,'lenS')],
      ['Bend zone ends', `start + BA`, fmtK(r.bendEnd,'lenS')],
      ['Outside radius', `R + T`, fmtK(r.R + r.T,'lenS')],
    ];
    el.innerHTML = `
      <div class="tiles">
        ${tile('Flat length', fmtK(r.flat,'lenS'), 'primary')}
        ${tile('Bend line from edge A', fmtK(r.bendCenter,'lenS'))}
        ${tile('Bend deduction', fmtK(r.BD,'lenS'))}
        ${tile('Bend allowance', fmtK(r.BA,'lenS'))}
      </div>
      ${r.warnings.map(w => `<div class="warn">⚠ ${w}</div>`).join('')}
      <div class="panels two">
        <figure class="panel"><figcaption>FORMED PART · θ = ${fmtNum(v.angle,1)}°</figcaption>${profileSVG(v, r)}</figure>
        <figure class="panel"><figcaption>FLAT PATTERN · bend line dashed</figcaption>${flatSVG(v, r)}</figure>
      </div>
      <details class="adv card"><summary>Advanced details — every step with your numbers</summary>
        <table><tr><th>Quantity</th><th>Formula</th><th>Value</th></tr>
        ${rows.map(x => `<tr><td>${x[0]}</td><td class="mono">${x[1]}</td><td class="mono">${x[2]}</td></tr>`).join('')}
        </table>
      </details>`;
  },
  validation(){
    // Hand calculation (worked in the docs): 1/16" sheet, R = 1/16", 90°, K = 0.44, A = B = 1"
    const v = { thickness:1.5875, radius:1.5875, k:0.44, angle:90, flangeA:25.4, flangeB:25.4 };
    const r = this.compute(v);
    return [
      { name:'Bend allowance', expected:0.141372, got:r.BA/25.4, unit:'in', tol:1e-4 },
      { name:'Bend deduction', expected:0.108628, got:r.BD/25.4, unit:'in', tol:1e-4 },
      { name:'Flat length',    expected:1.891372, got:r.flat/25.4, unit:'in', tol:1e-4 },
    ];
  },
  docs(){ return `
    <div><h3>How it works</h3>
      <p>When sheet metal bends, the inside squeezes and the outside stretches. Somewhere in between is the <b>neutral axis</b>, which keeps its length. The K-factor says where it sits: <code>K·T</code> in from the inside face.</p>
      <div class="eq">BA   = θ · (R + K·T)          ← length of neutral axis in the bend
OSSB = tan(θ/2) · (R + T)       ← outside setback
BD   = 2·OSSB − BA              ← bend deduction
Flat = A + B − BD</div>
      <p>θ is in radians in the BA formula. A and B are measured to the outside corner (mold line), the way most drawings dimension a flange.</p>
    </div>
    <div><h3>Validation</h3>
      <p>Hand calculation: T = R = 0.0625 in, θ = 90°, K = 0.44, A = B = 1 in.<br>
      BA = (π/2)(0.0625 + 0.0275) = 0.14137 · OSSB = 0.125 · BD = 0.25 − 0.14137 = 0.10863 · Flat = 1.89137</p>
      ${validationTable(this)}
      <p style="color:var(--muted)">TODO: add a case from a published textbook or shop bend chart so the check isn't only against our own hand math.</p>
    </div>`; }
};

function profileSVG(v, r){
  // Draw the formed part as its mold-line outline, with the stroke as thick as the metal.
  const A = v.flangeA, B = v.flangeB, th = r.th;
  const p0 = [0,0], p1 = [A,0], p2 = [A + B*Math.cos(th), B*Math.sin(th)];
  const xs = [p0[0],p1[0],p2[0]], ys = [p0[1],p1[1],p2[1]];
  let minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
  const span = Math.max(maxx-minx, maxy-miny, 1), pad = span*0.18, padR = span*0.55;
  if (maxy - miny < span*0.35){ const c=(maxy+miny)/2; miny = c - span*0.175; maxy = c + span*0.175; }
  const fs = span*0.065, sw = Math.max(v.thickness, span*0.012);
  const P = p => `${p[0].toFixed(3)},${(-p[1]).toFixed(3)}`;   // flip y: SVG y grows downward
  const midA = [A/2, 0], midB = [(p1[0]+p2[0])/2, (p1[1]+p2[1])/2];
  const nB = [Math.sin(th), -Math.cos(th)];                    // points to the outside of the bend
  return `<svg viewBox="${minx-pad} ${-maxy-pad} ${maxx-minx+pad+padR} ${maxy-miny+2*pad}" preserveAspectRatio="xMidYMid meet">
    <polyline points="${P(p0)} ${P(p1)} ${P(p2)}" fill="none" stroke="${COL.blue}" stroke-width="${sw}" stroke-linejoin="round"/>
    <text x="${midA[0]}" y="${fs*1.9}" fill="${COL.white}" font-size="${fs}" text-anchor="middle">A = ${fmtK(A,'lenS')}</text>
    <text x="${midB[0]+nB[0]*fs*1.6}" y="${-(midB[1]+nB[1]*fs*1.6)}" fill="${COL.white}" font-size="${fs}" text-anchor="start">B = ${fmtK(B,'lenS')}</text>
  </svg>`;
}
function flatSVG(v, r){
  const L = Math.max(r.flat, 1e-6), Wd = v.width, span = Math.max(L, Wd), fs = span*0.085, pad = span*0.1;
  const x0 = -pad, y0 = -fs*3.2, w = L + 2*pad, h = Wd + fs*6.4;
  const tick = (x, y) => `<line x1="${x}" y1="${y-fs*0.4}" x2="${x}" y2="${y+fs*0.4}" stroke="${COL.text}" stroke-width="${span*0.004}"/>`;
  const yTop = -fs*1.4, yBot = Wd + fs*1.4, sw = span*0.004;
  return `<svg viewBox="${x0} ${y0} ${w} ${h}" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="${L}" height="${Wd}" fill="rgba(79,141,245,.12)" stroke="${COL.blue}" stroke-width="${sw*1.5}"/>
    <rect x="${r.bendStart}" y="0" width="${Math.max(r.BA,0)}" height="${Wd}" fill="rgba(240,164,58,.25)"/>
    <line x1="${r.bendCenter}" y1="${-fs*0.3}" x2="${r.bendCenter}" y2="${Wd+fs*0.3}" stroke="${COL.orange}" stroke-width="${sw*1.5}" stroke-dasharray="${fs*0.5} ${fs*0.3}"/>
    <line x1="0" y1="${yTop}" x2="${L}" y2="${yTop}" stroke="${COL.text}" stroke-width="${sw}"/>${tick(0,yTop)}${tick(L,yTop)}
    <text x="${L/2}" y="${yTop-fs*0.5}" fill="${COL.white}" font-size="${fs}" text-anchor="middle">${fmtK(r.flat,'lenS')}</text>
    <line x1="0" y1="${yBot}" x2="${r.bendCenter}" y2="${yBot}" stroke="${COL.orange}" stroke-width="${sw}"/>${tick(0,yBot)}${tick(r.bendCenter,yBot)}
    <text x="${r.bendCenter/2}" y="${yBot+fs*1.3}" fill="${COL.orange}" font-size="${fs}" text-anchor="middle">${fmtK(r.bendCenter,'lenS')}</text>
  </svg>`;
}

/* ---------- 4b. Shot trajectory ---------- */
// Air density used by both shooter calculators: ISA standard sea-level air, 15 °C and 101.325 kPa
// (Wikipedia, "Density of air": 1.2250 kg/m³).
const G = 9.80665, RHO = 1.2250;
// Backspin lift coefficient from the spin ratio S = r·ω / |v| (the fit ambcalc uses). Shared by both shooter calculators.
const magnusCl = S => S < 0.1 ? 1.6*S : 0.6*S + 0.1;
// ---- Shared ball-flight physics: both shooter calculators (Shot Trajectory and Projectile) use these two. ----
// Acceleration of the ball from gravity, air drag and backspin lift.
// p: { drag, magnus, cd, mass (kg), diam (mm), spin (rpm), rho (optional, kg/m³; tests only) }
function ballAcc(p){
  // kd = drag constant: a_drag = −kd·|v|·v   (from F = ½·ρ·Cd·A·v²)
  // kl·C_L = lift constant: a_lift = kl·C_L·|v|·(−v_y, v_x)   (from F = ½·ρ·C_L·A·v², at right angles to the path)
  const rho = p.rho || RHO, area = Math.PI * (p.diam/1000/2)**2, r = p.diam/2000, w = (p.spin || 0)*Math.PI/30;
  const kd = p.drag ? 0.5*rho*p.cd*area/p.mass : 0;
  const kl = p.magnus && w > 0 ? 0.5*rho*area/p.mass : 0;
  return (vx, vy) => { const s = Math.hypot(vx, vy), kL = kl && s > 0 ? kl*magnusCl(r*w/s) : 0;
    return [-kd*s*vx - kL*s*vy, -G - kd*s*vy + kL*s*vx]; };
}
// One Runge-Kutta (RK4) step of length dt: samples the acceleration four times across the step and averages them.
// Much more accurate than x += v·dt. Returns the new [x, y, vx, vy].
function rk4Step(acc, x, y, vx, vy, dt){
  const [ax1,ay1] = acc(vx,vy);
  const vx2 = vx+ax1*dt/2, vy2 = vy+ay1*dt/2; const [ax2,ay2] = acc(vx2,vy2);
  const vx3 = vx+ax2*dt/2, vy3 = vy+ay2*dt/2; const [ax3,ay3] = acc(vx3,vy3);
  const vx4 = vx+ax3*dt,   vy4 = vy+ay3*dt;   const [ax4,ay4] = acc(vx4,vy4);
  return [x  + dt/6*(vx +2*vx2+2*vx3+vx4), y  + dt/6*(vy +2*vy2+2*vy3+vy4),
          vx + dt/6*(ax1+2*ax2+2*ax3+ax4), vy + dt/6*(ay1+2*ay2+2*ay3+ay4)];
}
function makeSim(p){
  const acc = ballAcc(p);
  // Returns where the ball crosses the target height on the way DOWN (x = −∞ if it never does).
  return function sim(angDeg, v, record){
    const a = angDeg*Math.PI/180, dt = 0.004;
    let x = 0, y = p.h0, vx = v*Math.cos(a), vy = v*Math.sin(a), t = 0, apex = y;
    const pts = record ? [[x,y]] : null;
    for (let i = 0; i < 3000; i++){
      const [nx, ny, nvx, nvy] = rk4Step(acc, x, y, vx, vy, dt);
      if (ny > apex) apex = ny;
      if (nvy < 0 && y >= p.H && ny < p.H){
        const f = (y - p.H)/(y - ny), xc = x + f*(nx - x);
        if (record) pts.push([xc, p.H]);
        return { x:xc, t:t + f*dt, apex, pts, hit:true };
      }
      x = nx; y = ny; vx = nvx; vy = nvy; t += dt;
      if (record) pts.push([x,y]);
      if (vy < 0 && y < p.H) break;   // falling and already below the target: it will never get there
    }
    return { x:-Infinity, t, apex, pts, hit:false };
  };
}
function bisect(f, lo, hi, target, iters=32){
  // f is increasing in its argument; find arg where f(arg) = target
  if (f(hi) < target) return null;
  if (f(lo) >= target) return lo;
  for (let i=0;i<iters;i++){ const mid=(lo+hi)/2; if (f(mid) < target) lo = mid; else hi = mid; }
  return (lo+hi)/2;
}
const SHOT = {
  id:'shot', group:'Shooter', title:'Shot Trajectory',
  lede:'Every launch angle and speed that drops the ball into the goal, and the single shot most tolerant of your shooter’s speed and angle errors.',
  inputs:[
    {section:'Geometry'},
    {key:'h0', label:'Release height', kind:'len', def:0.6096},
    {key:'dist', label:'Distance to goal center', kind:'len', def:3.9624},
    {key:'H', label:'Goal height', kind:'len', def:1.8288},
    {key:'w', label:'Goal opening (front to back)', kind:'len', def:1.0668},
    {key:'ceiling', label:'Max ball height (0 = none)', kind:'len', def:0},
    {section:'Search'},
    {key:'amin', label:'Min launch angle', kind:'deg', def:25},
    {key:'amax', label:'Max launch angle', kind:'deg', def:80},
    {key:'sv', label:'Speed error (1σ)', kind:'speed', def:0.1524, help:'How far your flywheel speed typically drifts.'},
    {key:'sa', label:'Angle error (1σ)', kind:'deg', def:1.0, help:'How far your hood angle typically drifts.'},
    {section:'Air drag & spin'},
    {key:'drag', label:'Include air drag', type:'check', def:false, help:'Uses sea-level air: 1.225 kg/m³ at 15 °C (59 °F), 1 atm. See the notes below.'},
    {key:'magnus', label:'Include backspin lift (Magnus)', type:'check', def:false},
    {key:'mass', label:'Ball mass', kind:'mass', def:0.215, showIf:v=>v.drag || v.magnus},
    {key:'diam', label:'Ball diameter', kind:'lenS', def:150, showIf:v=>v.drag || v.magnus},
    {key:'cd', label:'Drag coefficient (Cd)', kind:'none', def:0.47, showIf:v=>v.drag, help:'0.47 is a smooth sphere — a placeholder until you measure your ball.'},
    {key:'spin', label:'Backspin', kind:'rpm', def:600, showIf:v=>v.magnus, help:'Ball spin, not flywheel speed. Lift pushes at right angles to the path: flatter shots carry farther, very steep shots can land shorter.'},
  ],
  compute(v){
    const p = { ...v };
    const sim = makeSim(p);
    const near = v.dist - v.w/2, far = v.dist + v.w/2;
    const warnings = [];
    if (v.w <= 0) warnings.push('Goal opening must be larger than zero.');
    if (v.amax <= v.amin) warnings.push('Max angle must be larger than min angle.');
    // For each launch angle: the slowest shot that lands at the near lip (red) and the fastest at the far lip (green).
    const rows = [];
    const step = 1;
    for (let a = Math.ceil(v.amin); a <= v.amax + 1e-9; a += step){
      const land = s => sim(a, s).x;
      let lo = bisect(land, 0.2, 60, near), hi = bisect(land, 0.2, 60, far);
      if (lo !== null && hi !== null && v.ceiling > 0){
        const vc = bisect(s => sim(a, s).apex, 0.2, 60, v.ceiling);
        if (vc !== null) hi = Math.min(hi, vc);
      }
      rows.push((lo !== null && hi !== null && hi > lo) ? { a, lo, hi } : { a, lo:null, hi:null });
    }
    // Score each angle: how many "standard errors" of margin does the middle speed have?
    const margin = (row, s) => row.lo === null ? -Infinity : Math.min(s - row.lo, row.hi - s);
    let best = null;
    rows.forEach((row, i) => {
      if (row.lo === null) return;
      const s = (row.lo + row.hi)/2, sTol = (row.hi - row.lo)/2;
      // angle tolerance at this speed: walk to neighbours while still inside, then interpolate the edge
      const edge = dir => {
        let j = i;
        while (rows[j+dir] && margin(rows[j+dir], s) >= 0) j += dir;
        const n = rows[j+dir], mj = margin(rows[j], s);
        if (!n || !Number.isFinite(margin(n, s))) return rows[j].a;
        const mn = margin(n, s); return rows[j].a + dir*step*mj/(mj - mn);
      };
      const aLo = edge(-1), aHi = edge(1);
      const score = Math.min(sTol / v.sv, Math.min(row.a - aLo, aHi - row.a) / v.sa);
      if (!best || score > best.score) best = { a:row.a, s, sTol, aLo, aHi, score };
    });
    if (best){
      const t = sim(best.a, best.s, true); best.tof = t.t; best.apex = t.apex; best.pts = t.pts;
    } else if (!warnings.length) warnings.push('No shot reaches the goal in this angle range — try a wider range or check the heights.');
    // curves for the left plot (every 2°)
    const curves = rows.filter(r => r.lo !== null && r.a % 2 === 0).map(r => ({
      lo: sim(r.a, r.lo, true).pts, hi: sim(r.a, r.hi, true).pts }));
    return { rows, best, curves, near, far, warnings };
  },
  renderOut(el, v, r){
    const b = r.best;
    el.innerHTML = `
      <div class="tiles">
        ${tile('Launch angle', b ? fmtNum(b.a,1)+'°' : '—', 'primary')}
        ${tile('Launch speed', b ? fmtK(b.s,'speed') : '—', 'primary')}
        ${tile('Time of flight', b ? fmtNum(b.tof,3)+' s' : '—')}
        ${tile('Peak height', b ? fmtK(b.apex,'len') : '—')}
      </div>
      ${r.warnings.map(w => `<div class="warn">⚠ ${w}</div>`).join('')}
      <div class="panels shot">
        <figure class="panel"><figcaption>TRAJECTORIES · side view</figcaption><canvas id="cvTraj"></canvas>
          <div class="legend"><span><i style="background:${COL.green}"></i>fastest shot that scores</span>
            <span><i style="background:${COL.red}"></i>slowest shot that scores</span>
            <span><i style="background:${COL.blue}"></i>most robust shot</span></div></figure>
        <figure class="panel"><figcaption>VALID SHOT REGION · angle vs speed</figcaption><canvas id="cvRegion"></canvas>
          <div class="readout">${b ? `
            <span style="color:${COL.blue}"><b>Optimal:</b> ${fmtNum(b.a,1)}° @ ${fmtK(b.s,'speed')}</span><br>
            <span style="color:${COL.orange}"><b>Speed:</b> ${fmtSign(-b.sTol,'speed')} / ${fmtSign(b.sTol,'speed')} ${U('speed')[0]}</span><br>
            <span style="color:${COL.purple}"><b>Angle:</b> −${fmtNum(b.a-b.aLo,1)}° / +${fmtNum(b.aHi-b.a,1)}°</span><br>
            <span><b>Margin:</b> ${fmtNum(b.score,1)} σ before a miss</span>` : 'No valid shot.'}</div></figure>
      </div>`;
    drawTraj(document.getElementById('cvTraj'), v, r);
    drawRegion(document.getElementById('cvRegion'), v, r);
  },
  validation(){
    // No drag, release height = goal height → textbook range formula R = v²·sin(2θ)/g
    const base = { h0:1, H:1, drag:false, mass:1, diam:100, cd:0 };
    const sim = makeSim(base);
    return [
      { name:'45°, 7 m/s', expected:49*Math.sin(Math.PI/2)/G, got:sim(45,7).x, unit:'m', tol:1e-3 },
      { name:'30°, 10 m/s', expected:100*Math.sin(Math.PI/3)/G, got:sim(30,10).x, unit:'m', tol:1e-3 },
      { name:'60°, 10 m/s', expected:100*Math.sin(2*Math.PI/3)/G, got:sim(60,10).x, unit:'m', tol:1e-3 },
      ...this.magnusChecks(),
    ];
  },
  magnusChecks(){
    // Same ball and shot through both calculators' flight code: they share ballAcc + rk4Step, so they must agree
    // (Shot steps every 4 ms, Projectile every 1 ms).
    const ball = { drag:true, magnus:true, cd:0.47, diam:177.8, spin:600 }, h0 = 0.6, H = 2;
    const shot = (o, a, s) => makeSim({ h0, H, mass:0.2268, ...ball, ...o })(a, s).x;
    const proj = (o, a, s) => projFly({ mode:'height', bmass:0.2268, ...ball, ...o }, h0, s, a*Math.PI/180, (x,y,vx,vy) => vy <= 0 && y <= H).x;
    const off = shot({ magnus:false }, 50, 9);
    return [
      { name:'Drag + 600 rpm backspin, 50°, 9 m/s: matches the Projectile simulator', expected:proj({}, 50, 9), got:shot({}, 50, 9), unit:'m', tol:1e-4 },
      { name:'… lift only (no drag)', expected:proj({ drag:false }, 50, 9), got:shot({ drag:false }, 50, 9), unit:'m', tol:1e-4 },
      { name:'Lift on with 0 rpm spin = lift off', expected:off, got:shot({ spin:0 }, 50, 9), unit:'m', tol:1e-9 },
      { name:'Backspin carries the ball farther (1 = yes)', expected:1, got:shot({}, 50, 9) > off ? 1 : 0, unit:'', tol:0 },
    ];
  },
  docs(){ return `
    <div><h3>How it works</h3>
      <ol>
        <li><b>Simulate one shot.</b> Step the ball forward in tiny time steps under gravity (and drag, if on).</li>
        <li><b>Find the limits.</b> For each launch angle, search for the slowest speed that just clears the near lip (red) and the fastest that just reaches the far lip (green). Anything between scores.</li>

function beltLen(C, D1, D2){
  const big = Math.max(D1,D2), small = Math.min(D1,D2), phi = Math.asin((big-small)/(2*C));

function beltSVG(r){
  // Pulley 1 at (0,0), pulley 2 at (C,0). Belt follows the pitch circles; outer tangent lines join them.
  const g = r.g, C = r.C, r1 = g.D1/2, r2 = g.D2/2, o1 = g.od1/2, o2 = g.od2/2;
  const a = Math.acos(Math.max(-1, Math.min(1, (r1 - r2)/C)));   // angle of the tangent points
  const pts = [];
  for (let i = 0; i <= 60; i++){ const t = a + (2*Math.PI - 2*a)*i/60; pts.push([r1*Math.cos(t), r1*Math.sin(t)]); }
  for (let i = 0; i <= 60; i++){ const t = -a + 2*a*i/60; pts.push([C + r2*Math.cos(t), r2*Math.sin(t)]); }
  const path = 'M' + pts.map(p => `${p[0].toFixed(3)},${(-p[1]).toFixed(3)}`).join(' L') + ' Z';
  const R = Math.max(r1, r2, o1, o2), w = C + Math.max(r1,o1) + Math.max(r2,o2), fs = Math.max(w, 2*R)*0.05;
  const x0 = -Math.max(r1,o1) - fs, y0 = -R - fs, W = w + 2*fs, H = 2*R + fs*4.5, sw = Math.max(w, 2*R)*0.004;
  const yd = R + fs*1.6;
  return `<svg viewBox="${x0} ${y0} ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <circle cx="0" cy="0" r="${o1}" fill="rgba(79,141,245,.12)" stroke="${COL.blue}" stroke-width="${sw}"/>
    <circle cx="${C}" cy="0" r="${o2}" fill="rgba(79,141,245,.12)" stroke="${COL.blue}" stroke-width="${sw}"/>
    <circle cx="0" cy="0" r="${r1}" fill="none" stroke="${COL.text}" stroke-width="${sw*0.7}" stroke-dasharray="${fs*0.3} ${fs*0.25}"/>
    <circle cx="${C}" cy="0" r="${r2}" fill="none" stroke="${COL.text}" stroke-width="${sw*0.7}" stroke-dasharray="${fs*0.3} ${fs*0.25}"/>
    <path d="${path}" fill="none" stroke="${COL.green}" stroke-width="${sw*2.5}" stroke-linejoin="round"/>
    <text x="0" y="${fs*0.35}" fill="${COL.white}" font-size="${fs}" text-anchor="middle">${g.N1}T</text>
    <text x="${C}" y="${fs*0.35}" fill="${COL.white}" font-size="${fs}" text-anchor="middle">${g.N2}T</text>
    <line x1="0" y1="${yd}" x2="${C}" y2="${yd}" stroke="${COL.orange}" stroke-width="${sw}"/>
    <line x1="0" y1="${yd-fs*0.4}" x2="0" y2="${yd+fs*0.4}" stroke="${COL.orange}" stroke-width="${sw}"/>
    <line x1="${C}" y1="${yd-fs*0.4}" x2="${C}" y2="${yd+fs*0.4}" stroke="${COL.orange}" stroke-width="${sw}"/>
    <text x="${C/2}" y="${yd+fs*1.3}" fill="${COL.orange}" font-size="${fs}" text-anchor="middle">C-C ${fmtK(r.Cf,'lenS')}</text>
  </svg>`;
}

/* Straight-line DC motor model, same as ambcalc.com:
   every spec-sheet number (free speed, stall torque, both currents) scales with voltage / 12 V,
   and gearbox efficiency + motor count are folded into one "total stall torque". */
function mechAt(v, G){
  const n = Math.max(1, Math.round(v.n)), eff = v.eff/100, r = v.radius/1000, s = v.volt/12;
  const wf   = v.fs * Math.PI/30 * s;                    // free speed at this voltage (rad/s)
  const Ttot = v.ts * s * eff * n;                       // total stall torque after the gearbox losses (N·m)
  const kI   = (v.is - v.if) / (v.ts * eff * n);         // amps per motor for each N·m of output torque (× G)
  const If   = v.if * s;                                 // free current per motor at this voltage
  const loadT = v.load * G0 * r;                         // torque the load puts on the output (N·m)
  const Imax = v.ilim > 0 ? Math.min(v.is*s, v.ilim) : v.is*s;          // most current one motor can draw
  const Tmax = Ttot * (Imax - If) / (v.is*s - If);                      // most output torque (× G), after any limit
  const I    = kI * loadT / G + If;                                     // current per motor to move the load
  const moves = G > 0 && I <= Imax && loadT < Tmax * G;
  const wOut = moves ? wf/G * (1 - loadT/(Ttot*G)) : 0;                 // loaded output speed (rad/s)
  return {
    n, wf, Ttot, kI, If, loadT, Imax, Tmax, Inatural:I, I:Math.min(I, Imax), moves,
    freeRpm: wf/G * 30/Math.PI, loadRpm: wOut * 30/Math.PI,
    freeLin: wf/G * r, loadLin: wOut * r,
    stallMass: Tmax * G / (G0 * r),                      // heaviest load it can hold at this ratio
    stallV: loadT / (Ttot * G) * v.volt,                 // volts needed just to hold the load still
    sysEff: moves ? (wOut * loadT) / (I * n * v.volt) : 0,   // useful power out ÷ electrical power in
  };
}
// Ratio that makes one chosen output hit a target — each line is the formula above solved for G.
function mechSolve(v){
  const a = mechAt(v, 1), r = v.radius/1000, T = a.loadT;
  switch (v.solve){
    case 'ratio':    return v.ratio;
    case 'lin':      return mechSolve({ ...v, solve:'rpm', tRpm: v.tLin/r * 30/Math.PI });
    case 'rpm': { const w = v.tRpm * Math.PI/30, d = 1 - 4*(T/a.Ttot)*(w/a.wf);
                 return d < 0 || !(w > 0) ? NaN : a.wf/(2*w) * (1 + Math.sqrt(d)); }   // the bigger (slower-motor) root
    case 'freelin':  return a.wf * r / v.tFreeLin;
    case 'current':  return v.tAmp > a.If ? a.kI * T / (v.tAmp - a.If) : NaN;
    case 'stall':    return v.tStall * G0 * r / a.Tmax;
    case 'stallv':   return T / (a.Ttot * v.tStallV / v.volt);
    case 'maxpower': return 2 * T / a.Ttot;
    case 'maxeff':   return T / a.Ttot * (1 + Math.sqrt(v.is / v.if));
  }
  return NaN;
}

/* ---------- 4f. Mechanism startup (time to move) ---------- */
/* Steps the motion forward in time (RK4, 1 ms steps) instead of assuming steady speed,
   so it includes the time to speed up and the current limit. Same model as ambcalc.com/startup. */
function startupSim(v, G){
  const n = Math.max(1, Math.round(v.n)), eff = v.eff/100, r = v.radius/1000;
  const Ts = v.ts * eff * n, If = v.if * n, Is = v.is * n, wf = v.fs * Math.PI/30;
  const kT = Ts / (Is - If), kB = 12 / wf, R = 12 / (Is - If);       // torque/amp, volts per rad/s, resistance
  const ilim = (v.ilim > 0 ? v.ilim : Infinity) * n;
  const J = v.mass * r*r;                                             // moving mass as inertia at the output (kg·m²)
  const loadT = v.load * G0 * r;                                      // gravity load torque (N·m)
  const dt = v.dt/1000, Vb = v.volt;
  const target = v.by === 'pos'
    ? (v.units === 'rot' ? v.tRot*Math.PI/180 : v.tLin/r)            // rad at the output
    : (v.units === 'rot' ? v.tRotV*Math.PI/30 : v.tLinV/r);          // rad/s at the output
  const T = [0], X = [0], W = [0], A = [], I = [], lim = [];
  if (kT * ilim * G <= loadT) return { T:[0, v.tmax], X:[0,0], W:[0,0], A:[0,0], I:[0,0], lim:[false,false], stuck:true, time:v.tmax, reached:false };
  let V = Vb;
  const deriv = w => {                                                // → [dθ/dt, dω/dt, current]
    let i = (V - w*G*kB) / R + If;
    i = Math.min(Math.abs(i), ilim) * Math.sign(i);
    return [w, (kT*(i - If)*G - loadT) / J, i];
  };
  let reached = false;
  while (T[T.length-1] <= v.tmax){
    const x0 = X[X.length-1], w0 = W[W.length-1];
    if (v.by === 'pos' && v.stop === 'stopped'){
      // brake (full reverse voltage) once the stopping distance says we must
      const stopAt = target - w0*w0 / (2*((kT*(ilim + If)*G + loadT)/J));
      if (x0 >= stopAt) V = -Vb;
      if (w0 < 0){ reached = true; break; }
    } else if ((v.by === 'pos' && x0 > target) || (v.by === 'vel' && w0 > target)){ reached = true; break; }
    const k1 = deriv(w0), k2 = deriv(w0 + dt/2*k1[1]), k3 = deriv(w0 + dt/2*k2[1]), k4 = deriv(w0 + dt*k3[1]);
    A.push(k1[1]); I.push(k1[2]); lim.push(Math.abs(k1[2]) === ilim);
    X.push(x0 + dt/6*(k1[0] + 2*k2[0] + 2*k3[0] + k4[0]));
    W.push(w0 + dt/6*(k1[1] + 2*k2[1] + 2*k3[1] + k4[1]));
    T.push(T[T.length-1] + dt);
  }
  A.unshift(A[0] ?? 0); I.unshift(I[0] ?? 0); lim.unshift(lim[0] ?? false);
  return { T, X, W, A, I, lim, time:T[T.length-1], reached, target };
}

/* ---------- 4f2. Arm (revolute joint) ---------- */
/* Built on Mechanism Startup's motor model (same current, back-EMF and current-limit equations, RK4 steps),
   with what an arm adds: gravity that changes with the arm angle (cos θ), an arm tube as well as the load,
   and the inertia of the motor rotors and every gear-stage shaft scaled to the arm by ratio².
   The idea comes from a team spreadsheet (motor + gearbox + arm inertia, holding current, time to lift). */
const ARM_STAGES = [1, 2, 3, 4];
// Ratios, reflected inertia and gravity constant. Gtot (optional) replaces the total ratio by changing stage 1 only.
function armModel(v, Gtot){
  const st = ARM_STAGES.map(k => ({ k, a:v['s'+k+'a'], b:v['s'+k+'b'], J:v['s'+k+'J'] || 0 })).filter(s => s.a > 0 && s.b > 0);
  const ratios = st.map(s => s.b/s.a);
  if (Gtot && ratios.length) ratios[0] = Gtot / ratios.slice(1).reduce((p, x) => p*x, 1);
  const G = ratios.reduce((p, x) => p*x, 1), n = Math.max(1, Math.round(v.n)), L = v.len/1000;
  // each stage's output shaft turns (product of the ratios after it) times faster than the arm
  const parts = [{ label:`Motor rotors (${n} × rotor × ${fmtNum(G,1)}²)`, J:n*(v.Jr || 0)*G*G }];
  st.forEach((s, i) => { const after = ratios.slice(i+1).reduce((p, x) => p*x, 1);
    parts.push({ label:i === st.length-1 ? `Stage ${s.k} shaft (the arm shaft, × 1²)` : `Stage ${s.k} shaft (× ${fmtNum(after,2)}²)`, J:s.J*after*after }); });
  parts.push({ label:'Arm load (point mass: m·L²)', J:v.mload*L*L }, { label:'Arm tube (uniform rod: m·L²/3)', J:v.mtube*L*L/3 });

  const Cg = G0*(v.mload*L + v.mtube*L/2);                                // gravity torque with the arm horizontal (N·m)
  return { stages:st, ratios, G, n, L, parts, J, Cg };

  compute(v){
    if (!motorOk(v)) return { bad:true, warnings:[MOTOR_BAD] };
    if (!(v.len > 0 && v.mload >= 0 && v.mtube >= 0 && v.mload + v.mtube > 0)) return { bad:true, warnings:['Pivot-to-load distance must be above zero, and the arm needs some mass.'] };
    if (!(v.a1 > v.a0)) return { bad:true, warnings:['End angle must be bigger than the start angle (this calculator lifts the arm).'] };
    if (!(v.eff > 0 && v.tmax > 0)) return { bad:true, warnings:['Efficiency and max time must be above zero.'] };
    if (!(v.rmin > 0 && v.rmax > v.rmin && v.rstep > 0)) return { bad:true, warnings:['The ratio search needs 0 < "from" < "to" and a step above zero.'] };
    if ((v.rmax - v.rmin)/v.rstep > 200) return { bad:true, warnings:['That search has more than 200 ratios. Use a bigger step.'] };
    const n = Math.max(1, Math.round(v.n)), warnings = [];
    // Holding: the worst angle in the range is the one closest to horizontal
    const th0 = v.a0*Math.PI/180, th1 = v.a1*Math.PI/180, cross = th0 <= 0 && th1 >= 0;
    const cosMax = cross ? 1 : Math.max(Math.cos(th0), Math.cos(th1));
    const holdAt = cross ? 0 : (Math.cos(th0) >= Math.cos(th1) ? v.a0 : v.a1);
    const hold = armModel(armPlain(v, 1)).Cg*cosMax;
    const Rm = 12/(v.is - v.if);
    const kTn = v.ts*v.eff/100/(v.is - v.if);                          // torque per motor amp (with efficiency)
    const maxTat = G => kTn*(Math.min(v.is, v.ilim > 0 ? v.ilim : Infinity) - v.if)*n*G;
    // ---- Step 1: ratio search (one ideal stage, motor rotors only) ----
    const rows = [];
    for (let i = 0; v.rmin + i*v.rstep <= v.rmax + 1e-9; i++){
      const G = v.rmin + i*v.rstep, sim = armSim(v, armModel(armPlain(v, G))), hI = armHoldI(v, hold, G);
      rows.push({ G, holdI:hI, heat:hI*hI*Rm, time:sim.reached ? sim.time : NaN, stuck:sim.stuck, margin:maxTat(G)/hold,
        armRpm:v.fs/G, peakI:Math.max(...sim.I.map(Math.abs))/n });
    }
    const okRows = rows.filter(x => Number.isFinite(x.time));
    const meets = okRows.filter(x => x.holdI <= v.hmax);
    const rec = meets.length ? meets.reduce((a, b) => b.time < a.time ? b : a) : null;
    if (!rec){
      if (okRows.length) warnings.push(`No ratio from ${fmtNum(v.rmin,0)} to ${fmtNum(v.rmax,0)} : 1 holds the arm at or under ${fmtNum(v.hmax,1)} A per motor. Search higher ratios, add a motor or counterbalance the arm.`);
      else warnings.push('No ratio in the search lifts the arm to the end angle in time. Check the motor, the load and the search range.');
    }
    const fastest = okRows.length ? okRows.reduce((a, b) => b.time < a.time ? b : a) : null;
    // ---- Step 2: refine with the real stages ----
    let ref = null;
    const m = armModel(v);
    if (m.stages.length){
      const sim = armSim(v, m), holdI = armHoldI(v, hold, m.G), w2 = [];
      if (sim.stuck) w2.push('Gravity wins: the motors can’t lift the arm past the heaviest point with these stages and current limit.');
      else if (!sim.reached) w2.push(`It did not reach the end angle within ${v.tmax} s.`);
      if (v.ilim > 0 && holdI > v.ilim) w2.push(`Holding at ${fmtNum(holdAt,0)}° needs ${fmtNum(holdI,1)} A per motor, more than the ${fmtNum(v.ilim,0)} A current limit.`);
      else if (holdI > v.hmax) w2.push(`Holding at ${fmtNum(holdAt,0)}° needs ${fmtNum(holdI,1)} A per motor, over your ${fmtNum(v.hmax,1)} A target. Use a bigger ratio.`);
      ref = { m, sim, holdI, heat:holdI*holdI*Rm, margin:maxTat(m.G)/hold, peakI:Math.max(...sim.I.map(Math.abs))/n,
        limited:sim.lim.some(Boolean), warnings:w2 };
    }
    if (!(v.Jr > 0)) warnings.push('Rotor inertia is 0. At high ratios the motors can be a big share of the inertia; enter it if you know it.');
    return { hold, holdAt, rows, rec, fastest, ref, warnings };
  },

      s1a:1, s1b:100, s1J:0, s2a:0, s2b:0, s3a:0, s3b:0, s4a:0, s4b:0, len:500, mload:1, mtube:0, a0:-30, a1:60, rmin:20, rmax:400, tmax:5 };

/* ---------- 4g. Drivetrain sprint ---------- */
/* Same model as ambcalc.com/drivetrain: motor + battery resistance + wheel slip (static/kinetic friction)
   + speed-dependent gearbox loss, stepped every 1 ms. */
function driveSim(v, G){
  const n = Math.max(1, Math.round(v.n)), eff = v.eff/100;
  const wf = v.fs*Math.PI/30, Ts = v.ts*n, If = v.if*n, Is = v.is*n;
  const xmax = v.dist, dt = v.dt/1000, Rtot = v.res/1000;
  const Imax = v.ilim > 0 ? v.ilim*n : Infinity, dVmax = (v.vramp > 0 ? v.vramp : 1200) * dt;
  const m = v.weight, r = v.wheel/2/1000;
  const mus = v.cofs * v.driven/100, muk = v.cofk * v.driven/100;
  const km = Ts/(Is - If), ke = 12/wf, R = 12/(Is - If), L = 1e-4;    // L = winding inductance (H), roughly
  const Tss = 9.8*m*mus*r, Tsk = 9.8*m*muk*r, Tloss = Ts*(1 - eff), vmax = wf/G*r;
  const freeSpeed = vmax, pushCurrent = (Tsk/G/(km*eff) + If)/n;
  let t = 0, x = 0, vel = 0, V = v.vrest, I = 0, slip = false, stop = false, connected = true;
  const rows = [];
  main: while (t < v.tmax){
    I = connected ? (V + L/dt*I - vel*G/r*ke)/(R + L/dt) : 0;
    I = Math.min(Math.abs(I), Imax) * Math.sign(I);
    let Tm = (I - If)*km;
    let T = Tm*G*eff - Tloss*(vel/vmax) - (stop ? Tloss/eff : 0);
    if (slip && Math.abs(T) < Tsk) slip = false;
    else if (!slip && Math.abs(T) > Tss) slip = true;
    if (slip){ T = Tsk*Math.sign(T); Tm = T/(G*eff); I = (Math.abs(Tm/km) + If)*Math.sign(Tm); }
    const a = T/r/m;
    vel += a*dt; x += vel*dt + 0.5*a*dt*dt;
    if (v.stopM !== 'reverse' && stop) I = 0;
    rows.push([t, x, vel, a, I, V, slip]);
    if (v.stopT === 'none'){ if (x > xmax) break main; }
    else if (v.stopT === 'after'){ if (x > xmax){ stop = true; if (vel < 0.1) break main; } }
    else {   // predictive: start stopping when the remaining distance equals the stopping distance
      if (x > xmax - vel*vel/(2*(v.stopM === 'coast' ? 2*Tloss/r/m : 9.8*muk))) stop = true;
      if (stop && vel < 0.1) break main;
    }
    let Vnew;
    if (!stop) Vnew = v.vrest - Rtot*I;
    else if (v.stopM === 'coast'){ Vnew = 0; connected = false; }
    else if (v.stopM === 'brake') Vnew = 0;
    else Vnew = -(v.vrest - Rtot*I);
    V = Math.abs(Vnew - V) > dVmax ? V + dVmax*Math.sign(Vnew - V) : Vnew;
    t += dt;
  }
  return { rows, time:rows.length ? rows[rows.length-1][0] : 0, finished:t < v.tmax, freeSpeed, pushCurrent };
}
const DRIVE = {

torque   T = k_m(I − I_f)·G·eff − T_loss·v/v_max
slip if  |T| > μ_s·m·g·r   (then T = μ_k·m·g·r)
battery  V = V_rest − R_batt·I</div>

function drivePlots(v, r){
  const ca = document.getElementById('dtSim'), cb = document.getElementById('dtSweep'); if (!ca || !cb) return;
  const rows = r.sim.rows, n = Math.max(1, Math.round(v.n));
  const fl = U('len')[1], fs = U('speed')[1];
  const pos = rows.map(x => [x[0], x[1]/fl]), spd = rows.map(x => [x[0], x[2]/fs]), vol = rows.map(x => [x[0], x[5]]), amp = rows.map(x => [x[0], x[4]/n/10]);
  const yr = range([...pos, ...spd, ...vol, ...amp].map(p => p[1]));
  let f = frame(ca, [0, Math.max(r.sim.time, 1e-3)], [Math.min(0, yr[0]), yr[1]*1.08], 's', null, 'time (s)', 'value (see legend)');
  drawSeries(f, [{ pts:pos, col:COL.blue }, { pts:spd, col:COL.green }, { pts:vol, col:COL.purple }, { pts:amp, col:COL.orange },
    { pts:rows.map((x,i) => [x[0], x[6] ? spd[i][1] : NaN]), col:COL.red, w:4, dash:1 }]);
  const sw = r.sweep, yr2 = range(sw.flatMap(s => [s.time, s.free/fs, s.push/10]));
  f = frame(cb, [v.rmin, v.rmax], [0, yr2[1]*1.08], 'ratio', null, 'gear ratio (: 1, log scale)', 'value (see legend)', { xlog:true });
  drawSeries(f, [{ pts:sw.map(s => [s.G, s.time]), col:COL.white, w:2.5 }, { pts:sw.map(s => [s.G, s.free/fs]), col:COL.green }, { pts:sw.map(s => [s.G, s.push/10]), col:COL.orange }]);
  if (v.ratio >= v.rmin && v.ratio <= v.rmax) vline(f, v.ratio, COL.red, 0, yr2[1]*1.08);
}

/* ---------- 4h. Gearbox options (search vendor gear catalogs) ---------- */
// 20 DP gear catalogs from ambcalc.com (ref/gears-*.json), minus VEX (discontinued in FRC). "9/10" = a 9-tooth gear cut on a 10-tooth blank
// (profile-shifted): it meshes like 9 teeth for the ratio but takes the space of 10 for center distance.
// clr = how much room (in) the shaft/boss of that type needs — used by the axle-clearance check.
const GEAR_TYPES = {
  hex12:{ label:'1/2" Hex', clr:0.577 },   hex38:{ label:'3/8" Hex', clr:0.433 },  bearing:{ label:'Bearing Bore', clr:0 },
  cim:{ label:'CIM Gear', clr:0.315 },     splinexs:{ label:'SplineXS Gear', clr:0.313 }, kraken:{ label:'Kraken Spline', clr:0.293 },
  m775:{ label:'775 Gear', clr:0.197 },    m550:{ label:'550 Gear', clr:0.125 },
  maxspline:{ label:'MAXSpline', clr:1.376 }, splinexl:{ label:'SplineXL', clr:1.375 },
};
const evens = (a, b) => Array.from({ length:(b-a)/2+1 }, (_, i) => String(a + 2*i));
const GEAR_CATALOG = {
  wcp:{ label:'WCP', hex12:evens(16,84), hex38:'14 14/16 16 16/18 '+evens(18,52).join(' '), cim:'9/10 10/12 11/12 12 12/14 13/14 14 14/16 15/16 16',
        splinexs:'8/10 9/10 10/12 11/12 12 12/14 13/14 14 14/16 15/16 16', kraken:'8/10 9/10 10/12 11/12 12 13/14 14',
        m775:'6/8 8/10', m550:'6/8 8/10', splinexl:evens(34,84) },
  rev:{ label:'REV', hex12:'16 18 20 22 24 26 28 30 32 34 36 38 40 42 44 46 48 50 52 56 60 62 64 66 68 72 80', bearing:'60 64 68 80',
        cim:'10/12 11/12 12 13/14 14', maxspline:'32 36 40 48 52 54 56 58 60 64 68 80' },
  am: { label:'AndyMark', hex12:'18 20 24 25 29 30 32 35 36 38 40 43 45 46 48 50 52 56', hex38:'14 15 16 17 18 19 20 21 24 25 28 30 34 35 38 40 50 52',
        bearing:'50', cim:'12 14 15 16 17 35', kraken:'12 14 16' },
};
// → [{ t: teeth, s: size it occupies }] for one gear type across the chosen vendors (no duplicates)
function gearsOf(type, v){
  const seen = new Map();
  Object.entries(GEAR_CATALOG).forEach(([vendor, cat]) => {
    if (!v[vendor] || !cat[type]) return;
    (Array.isArray(cat[type]) ? cat[type] : cat[type].split(' ')).forEach(g => { const [t, s] = g.split('/').map(Number); seen.set(g, { t, s:s || t, name:g.replace('/', '(') + (g.includes('/') ? ')' : '') }); });
  });
  return [...seen.values()].sort((a,b) => a.t - b.t || a.s - b.s);
}
const typeOptions = Object.entries(GEAR_TYPES).map(([value, t]) => ({ value, label:t.label }));
const teethLim = (g, v, i) => (!(v['min'+i] > 0) || g.t >= v['min'+i]) && (!(v['max'+i] > 0) || g.t <= v['max'+i]);
const GBOX = {
  id:'gbox', group:'Power Transmission', title:'Gearbox Options',
  lede:'Type the ratio you want; get every 1- or 2-stage spur gearbox you can build from WCP, REV and AndyMark 20 DP gears, closest match first, with center distances and an axle-clearance check.',
  inputs:[
    {section:'Target'},
    {key:'ratio', label:'Total ratio', kind:'ratio', def:10},
    {key:'dev', label:'Max deviation', kind:'pct', def:5},
    {key:'stages', label:'Stages', type:'select', def:'2', options:[{value:'1', label:'1 stage'}, {value:'2', label:'2 stages'}]},
    {section:'Sources'},
    {key:'wcp', label:'WCP', type:'check', def:true},
    {key:'rev', label:'REV', type:'check', def:true}, {key:'am', label:'AndyMark', type:'check', def:true},
    {section:'Gear 1 (input pinion)'},
    {key:'type1', label:'Bore', type:'select', def:'kraken', options:typeOptions},
    {key:'min1', label:'Min teeth', kind:'teeth', def:0}, {key:'max1', label:'Max teeth', kind:'teeth', def:0},
    {section:'Gear 2 (stage 1 output)', showIf:v => v.stages === '2'},
    {key:'type2', label:'Bore', type:'select', def:'hex12', options:typeOptions, showIf:v => v.stages === '2', help:'Gears 2 and 3 share a shaft.'},
    {key:'min2', label:'Min teeth', kind:'teeth', def:0, showIf:v => v.stages === '2'}, {key:'max2', label:'Max teeth', kind:'teeth', def:0, showIf:v => v.stages === '2'},
    {section:'Gear 3 (stage 2 input)', showIf:v => v.stages === '2'},
    {key:'min3', label:'Min teeth', kind:'teeth', def:0, showIf:v => v.stages === '2'}, {key:'max3', label:'Max teeth', kind:'teeth', def:0, showIf:v => v.stages === '2'},
    {section:'Output gear'},
    {key:'type4', label:'Bore', type:'select', def:'hex12', options:typeOptions},
    {key:'min4', label:'Min teeth', kind:'teeth', def:0}, {key:'max4', label:'Max teeth', kind:'teeth', def:0, help:'0 = no limit.'},
    {section:'Clearance (2-stage)', showIf:v => v.stages === '2'},
    {key:'clr1', label:'Gear 3 must clear axle 1', type:'check', def:false, showIf:v => v.stages === '2'},
    {key:'clr4', label:'Gear 2 must clear axle 4', type:'check', def:true, showIf:v => v.stages === '2'},
  ],
  compute(v){
    if (!(v.ratio > 0)) return { bad:true, warnings:['Enter a ratio bigger than zero.'] };
    if (!['wcp','rev','am'].some(k => v[k])) return { bad:true, warnings:['Tick at least one vendor.'] };
    const lo = v.ratio*(1 - v.dev/100), hi = v.ratio*(1 + v.dev/100), two = v.stages === '2';
    const g1 = gearsOf(v.type1, v).filter(g => teethLim(g, v, 1)), g4 = gearsOf(v.type4, v).filter(g => teethLim(g, v, 4));
    const g2 = two ? gearsOf(v.type2, v).filter(g => teethLim(g, v, 2)) : [], g3 = two ? gearsOf(v.type2, v).filter(g => teethLim(g, v, 3)) : [];
    const out = [];
    const cc = (a, b) => (a.s + b.s)/40*25.4;                                // 20 DP: C-C (in) = (N1 + N2)/40
    for (const a of g1) for (const d of g4){
      if (!two){ const R = d.t/a.t; if (R >= lo && R <= hi) out.push({ gears:[a,d], R, cc:[cc(a,d)] }); continue; }
      for (const b of g2) for (const c of g3){
        const R = b.t/a.t * d.t/c.t; if (R < lo || R > hi) continue;
        // clearance: distance from the other stage's axle to this gear's outside edge (OD = (N+2)/20 in)
        if (v.clr1 && (a.s + b.s - (c.s + 2))/40 < GEAR_TYPES[v.type1].clr) continue;
        if (v.clr4 && (c.s + d.s - (b.s + 2))/40 < GEAR_TYPES[v.type4].clr) continue;
        out.push({ gears:[a,b,c,d], R, cc:[cc(a,b), cc(c,d)] });
      }
    }
    const size = o => o.gears.reduce((s, g) => s + g.s*g.s, 0);           // smaller gears first when equally close
    out.sort((x,y) => Math.abs(x.R/v.ratio - 1) - Math.abs(y.R/v.ratio - 1) || size(x) - size(y));
    const warnings = [];
    if (!g1.length) warnings.push(`No ${GEAR_TYPES[v.type1].label} gears from the ticked vendors.`);
    if (!out.length && g1.length) warnings.push('No gearbox found — widen the deviation, allow more vendors, or try 2 stages.');
    return { out, total:out.length, warnings };
  },
  renderOut(el, v, r){
    if (r.bad){ el.innerHTML = warnBox(r.warnings); return; }
    const two = v.stages === '2', rows = r.out.slice(0, 60);
    el.innerHTML = `
      <div class="tiles">
        ${tile('Options found', String(r.total), 'primary')}
        ${tile('Closest ratio', r.out[0] ? fmtNum(r.out[0].R,3)+' : 1' : '—', 'primary')}
        ${tile('Its error', r.out[0] ? fmtNum((r.out[0].R/v.ratio - 1)*100,2)+' %' : '—')}
      </div>
      ${warnBox(r.warnings)}
      <figure class="panel"><figcaption>GEARBOXES · closest first${r.total > 60 ? ` (first 60 of ${r.total})` : ''}</figcaption>
        <table class="dark"><tr><th>Stage 1</th>${two ? '<th>Stage 2</th>' : ''}<th>Ratio</th><th>Error</th><th>C-C${two ? ' 1 / 2' : ''}</th></tr>
        ${rows.map(o => `<tr><td class="mono">${o.gears[0].name} : ${o.gears[1].name}</td>${two ? `<td class="mono">${o.gears[2].name} : ${o.gears[3].name}</td>` : ''}
          <td class="mono">${o.R.toFixed(2)} : 1</td><td class="mono">${((o.R/v.ratio - 1)*100).toFixed(2)}%</td>
          <td class="mono">${o.cc.map(c => fmtK(c,'lenS')).join(' / ')}</td></tr>`).join('')}
        </table></figure>`;
  },
  validation(){
    const one = this.compute({ ratio:2, dev:0, stages:'1', wcp:true, rev:false, am:false, type1:'hex12', type4:'hex12', min1:0,max1:0,min4:0,max4:0 });
    return [
      { name:'WCP ½" hex, exactly 2:1 in one stage: 16:32 … 42:84 = 14 pairs', expected:14, got:one.total, unit:'', tol:0 },
      { name:'Smallest one is 16:32 → C-C = (16+32)/40 in', expected:48/40*25.4, got:one.out[0].cc[0], unit:'mm', tol:1e-9 },
      ...AMB_CHECKS.gbox(this),
    ];
  },
  docs(){ return `
    <div><h3>How it works</h3>
      <div class="eq">ratio  = (gear 2 / gear 1) × (gear 4 / gear 3)
C-C    = (N_a + N_b) / (2 · 20 DP)   [inches]
OD     = (N + 2) / 20 DP
clears = C-C(other stage) − OD/2 ≥ shaft room</div>
      <p>Every combination of catalog gears is tried; ones inside the deviation are kept and sorted by how close they are, then by size. A profile-shifted gear like 9(10) counts as 9 teeth for the ratio and 10 for spacing.</p>
    </div>
    <div><h3>Validation</h3>${validationTable(this)}</div>`; }
};

/* ---------- 4i. Reduction swap (same center distance, new ratio) ---------- */
const SWAP_FAMILIES = [
  { key:'g',   label:'20 DP gears',     kind:'gear', min:14, max:84 },
  { key:'p3',  label:'3 mm belt',       kind:'gt2',  min:18, max:60 },
  { key:'p5',  label:'5 mm belt',       kind:'htd5', min:18, max:60 },
  { key:'s25', label:'#25 chain',       kind:'c25',  min:16, max:72 },
  { key:'s35', label:'#35 chain',       kind:'c35',  min:12, max:60 },
];
const SWAP = {
  id:'swap', group:'Power Transmission', title:'Reduction Swap',
  lede:'Your two shafts are fixed. Which gears, pulleys or sprockets give a new ratio at the same center distance? Searches 20 DP gears, 3 mm / 5 mm belts and #25 / #35 chain.',
  inputs:[
    {section:'Current center distance'},
    {key:'cur', label:'Get it from', type:'select', def:'dist', options:[{value:'dist', label:'A measured distance'}, {value:'gears', label:'Current gears'}, {value:'belt', label:'Current belt / chain'}]},
    {key:'cc', label:'C-C distance', kind:'lenS', def:76.2, showIf:v => v.cur === 'dist'},
    {key:'cg1', label:'Gear 1', kind:'teeth', def:20, showIf:v => v.cur === 'gears'},
    {key:'cg2', label:'Gear 2', kind:'teeth', def:60, showIf:v => v.cur === 'gears'},
    {key:'cdp', label:'Diametral pitch', kind:'none', def:20, showIf:v => v.cur === 'gears'},
    {key:'cdrive', label:'Belt / chain', type:'select', def:'gt2', showIf:v => v.cur === 'belt',
      options:['c25','c35','gt2','htd5'].map(k => ({ value:k, label:DRIVES[k].label }))},
    {key:'cp1', label:'Pulley / sprocket 1', kind:'teeth', def:18, showIf:v => v.cur === 'belt'},
    {key:'cp2', label:'Pulley / sprocket 2', kind:'teeth', def:36, showIf:v => v.cur === 'belt'},
    {key:'clinks', label:'Belt teeth / chain links', kind:'teeth', def:80, showIf:v => v.cur === 'belt'},
    {key:'ccdev', label:'Max C-C deviation', kind:'lenS', def:0.254},
    {section:'New ratio'},
    {key:'ratio', label:'Target ratio', kind:'ratio', def:2},
    {key:'rdev', label:'Max deviation', kind:'pct', def:5},
    {section:'Search'},
    ...SWAP_FAMILIES.flatMap(f => [
      {key:f.key+'on', label:f.label, type:'check', def:true},
      {key:f.key+'min', label:'… smallest', kind:'teeth', def:f.min, showIf:v => v[f.key+'on']},
      {key:f.key+'max', label:'… biggest', kind:'teeth', def:f.max, showIf:v => v[f.key+'on']},
    ]),
  ],
  compute(v){
    let cc;
    if (v.cur === 'dist') cc = v.cc;
    else if (v.cur === 'gears') cc = (v.cg1 + v.cg2)/(2*v.cdp)*25.4;
    else cc = beltGeom({ drive:v.cdrive, pitch:DRIVES[v.cdrive].p, n1:v.cp1, n2:v.cp2 }).solveC(Math.round(v.clinks));
    if (!(cc > 0)) return { bad:true, warnings:['That current setup does not give a real center distance (belt too short?).'] };
    const lo = v.ratio*(1 - v.rdev/100), hi = v.ratio*(1 + v.rdev/100), out = [];
    SWAP_FAMILIES.forEach(f => {
      if (!v[f.key+'on']) return;
      const mn = Math.round(v[f.key+'min']), mx = Math.round(v[f.key+'max']);
      for (let A = mn; A <= mx; A++) for (let B = Math.max(mn, Math.ceil(A*lo)); B <= Math.min(mx, Math.floor(A*hi)); B++){
        if (f.kind === 'gear'){ const c = (A + B)/40*25.4; if (Math.abs(c - cc) <= v.ccdev) out.push({ f, A, B, R:B/A, c, len:null }); continue; }
        const g = beltGeom({ drive:f.kind, pitch:DRIVES[f.kind].p, n1:A, n2:B });
        const len = Math.round(g.lenP(cc)), c = g.solveC(len);              // nearest whole belt / chain, then its exact C-C
        if (c !== null && Math.abs(c - cc) <= v.ccdev) out.push({ f, A, B, R:B/A, c, len });
      }
    });
    out.sort((a,b) => Math.abs(a.c - cc) - Math.abs(b.c - cc));
    return { cc, out, warnings: out.length ? [] : ['Nothing fits — loosen the C-C deviation or the ratio deviation.'] };
  },
  renderOut(el, v, r){
    if (r.bad){ el.innerHTML = warnBox(r.warnings); return; }
    const rows = r.out.slice(0, 80);
    el.innerHTML = `
      <div class="tiles">${tile('Center distance', fmtK(r.cc,'lenS'), 'primary')}${tile('Options found', String(r.out.length), 'primary')}</div>

/* ---------- 4j. Planetary gearbox stacks ---------- */
const PLANETARIES = {
  maxplanetary:  { label:'REV MAXPlanetary',   stages:[3,4,5,9] },
  ultraplanetary:{ label:'REV UltraPlanetary', stages:[3,4,5] },
  planetaryx:    { label:'WCP PlanetaryX',     stages:[3,4,5], maxStages:3 },   // WCP docs: 3:1, 4:1, 5:1 gear sets; "stack one, two, or three stages"
};
const PLANET = {
  id:'planet', group:'Power Transmission', title:'Planetary Gearbox',
  lede:'Which stages should you stack to get close to a ratio? Lists every combination of stages from 0.66× to 1.5× your target, closest first, and the extra reduction you would still need.',
  inputs:[
    {key:'type', label:'Gearbox', type:'select', def:'maxplanetary', options:Object.entries(PLANETARIES).map(([value,p]) => ({ value, label:p.label }))},
    {key:'ratio', label:'Desired ratio', kind:'ratio', def:50},
  ],
  compute(v){
    const st = PLANETARIES[v.type].stages, maxN = PLANETARIES[v.type].maxStages || Infinity, D = v.ratio, out = [];
    if (!(D > 1)) return { bad:true, warnings:['Desired ratio must be bigger than 1.'] };
    // Grow stacks one stage at a time (smallest-first, never going back down the list so each set appears once)
    // and stop growing a stack once it reaches the target (or the gearbox's stage limit) — like ambcalc's search tree.
    const grow = (counts, start, R) => {
      if (R/D > 0.66 && R/D < 1.5) out.push({ R, counts:[...counts] });
      if (R >= D || counts.reduce((a,b) => a+b, 0) >= maxN) return;
      for (let i = start; i < st.length; i++){ counts[i]++; grow(counts, i, R*st[i]); counts[i]--; }
    };
    grow(st.map(() => 0), 0, 1);
    const n = o => o.counts.reduce((a,b) => a+b, 0);
    out.sort((a,b) => Math.abs(Math.log(a.R/D)) - Math.abs(Math.log(b.R/D)) || n(a) - n(b));
    // Target out of reach: show the biggest stack and the extra gear or chain stage needed after it.
    const label = PLANETARIES[v.type].label, top = Math.max(...st), low = Math.min(...st), warnings = [];
    let extra = null;
    if (!out.length && maxN < Infinity && D > top**maxN){
      const R = top**maxN; extra = D/R;
      out.push({ R, counts:st.map(s => s === top ? maxN : 0) });
      warnings.push(`${label} tops out at ${R}:1 (${maxN} stages of ${top}:1). Use that plus an extra ${extra.toFixed(2)}:1 gear or chain stage after the gearbox.`);
    } else if (!out.length && D < low/1.5){
      warnings.push(`The smallest stage is ${low}:1, more than you need. Skip the planetary and use a single ${D}:1 gear or chain stage.`);
    }
    return { st, out, extra, warnings };
  },
  renderOut(el, v, r){
    if (r.bad){ el.innerHTML = warnBox(r.warnings); return; }
    el.innerHTML = `
      <div class="tiles">${tile('Closest stack', r.out[0] ? fmtNum(r.out[0].R,0)+' : 1' : '—', 'primary')}${tile('Combinations', String(r.out.length))}
        ${r.extra ? tile('Extra stage needed', fmtNum(r.extra,2)+' : 1', 'primary') : ''}</div>
      ${warnBox(r.warnings)}
      ${r.extra ? `<p>${gotoBtn('gbox', { ratio:+r.extra.toFixed(3), dev:5, stages:r.extra > 5 ? '2' : '1', type1:'hex12', type4:'hex12' }, `Find gears for ${fmtNum(r.extra,2)}:1 in Gearbox Options →`)}
        <span class="help">For chain, pick sprockets with the same ratio (e.g. ${Math.round(15*r.extra)}T driven by a 15T).</span></p>` : ''}
      <figure class="panel"><figcaption>STAGE COMBINATIONS · closest first</figcaption>
        <table class="dark"><tr><th>Ratio</th><th>Stages</th><th>Made of</th><th>Still needed</th></tr>
        ${r.out.map(o => `<tr><td class="mono">${+o.R.toFixed(2)} : 1</td><td class="mono">${o.counts.reduce((a,b)=>a+b,0)}</td>
          <td>${o.counts.map((c,i) => c ? `${c}× ${r.st[i]}:1` : '').filter(Boolean).join(', ')}</td>
          <td class="mono">${o.R < v.ratio ? (v.ratio/o.R).toFixed(2)+' : 1 more' : o.R > v.ratio ? '1 : '+(o.R/v.ratio).toFixed(2)+' (overdrive)' : 'none'}</td></tr>`).join('')}
        </table></figure>`;
  },
  validation(){
    const r = this.compute({ type:'maxplanetary', ratio:45 });
    return [
      { name:'MAXPlanetary 45:1 → best is 5×9 exactly', expected:45, got:r.out[0].R, unit:':1', tol:1e-9 },
      { name:'… and it uses 2 stages', expected:2, got:r.out[0].counts.reduce((a,b)=>a+b,0), unit:'', tol:0 },
      { name:'PlanetaryX 60:1 → best is 3×4×5 exactly', expected:60, got:this.compute({ type:'planetaryx', ratio:60 }).out[0].R, unit:':1', tol:1e-9 },
      { name:'PlanetaryX 3-stage limit: asking 150:1, the biggest stack is 5×5×5 = 125', expected:125, got:Math.max(...this.compute({ type:'planetaryx', ratio:150 }).out.map(o => o.R)), unit:':1', tol:1e-9 },
      { name:'PlanetaryX asked for 400:1 → shows 125:1 plus an extra 3.2:1 stage', expected:3.2, got:this.compute({ type:'planetaryx', ratio:400 }).extra, unit:':1', tol:1e-9 },
      { name:'… and no stack has more than 3 stages', expected:3, got:Math.max(...this.compute({ type:'planetaryx', ratio:150 }).out.map(o => o.counts.reduce((a,b)=>a+b,0))), unit:'', tol:0 },
      ...AMB_CHECKS.planet(this),
    ];
  },
  docs(){ return `
    <div><h3>How it works</h3><p>A stack's ratio is the product of its stages (3:1 × 5:1 = 15:1). Every stack is tried until it reaches the target; stacks between 0.66× and 1.5× the target are listed. "Still needed" is the extra reduction (from a belt, chain or gear stage) to land exactly on target.</p>
      <p>WCP PlanetaryX has 3:1, 4:1 and 5:1 gear sets and stacks up to three stages (125:1 max). Ratios are the nominal ones from WCP's docs.</p></div>
    <div><h3>Validation</h3>${validationTable(this)}</div>`; }
};

/* ---------- 4k. Projectile (with optional drag + backspin lift) ---------- */
// Fly one ball until it lands or stop(x,y,vx,vy) says so. Uses the shared ballAcc + rk4Step (same physics as
// Shot Trajectory) in 1 ms steps. On the step where stop() first comes true, the exact moment is found by
// bisecting inside that step, so the result lands on the target instead of up to one step past it.
function projFly(v, h0, v0, th0, stop){
  const dt = 0.001, still = v.mode === 'launch';                 // launch solver is the no-drag formula
  const acc = ballAcc({ drag:v.drag && !still, magnus:v.magnus && !still, cd:v.cd, mass:v.bmass, diam:v.diam, spin:v.spin, rho:v.rho });
  let x = 0, y = h0, vx = v0*Math.cos(th0), vy = v0*Math.sin(th0), t = 0;
  const pts = [[x, y]];
  for (let i = 0; i < 200000 && y >= 0 && !stop(x, y, vx, vy); i++){
    let n = rk4Step(acc, x, y, vx, vy, dt), h = dt;
    if (stop(...n)){
      let lo = 0, hi = dt;                                         // stop() is false at lo, true at hi
      for (let k = 0; k < 30; k++){ const mid = (lo + hi)/2; if (stop(...rk4Step(acc, x, y, vx, vy, mid))) hi = mid; else lo = mid; }
      h = hi; n = rk4Step(acc, x, y, vx, vy, h);
    }
    [x, y, vx, vy] = n; t += h;
    pts.push([x, y]);
  }
  return { pts, x, y, vx, vy, t };
}
// Max fire rate (collision limit). Every ball flies the same path, one shot interval Δt behind the one before.
// The gap between two balls in flight is Δt × (speed halfway between them), so they come closest while
// straddling the apex, where the ball is slowest. Centres must stay at least one ball diameter D apart.
// pts are 1 ms apart and end when the ball reaches the goal (an earlier ball is gone once it scores).
function projFireRate(pts, D){
  const N = pts.length - 1;
  if (!(D > 0) || N < 2) return null;
  const gap = k => { let m = Infinity;
    for (let i = k; i <= N; i++) m = Math.min(m, Math.hypot(pts[i][0] - pts[i-k][0], pts[i][1] - pts[i-k][1]));
    return m; };
  if (gap(N) < D) return null;
  let lo = 1, hi = N;                                     // smallest whole-ms spacing that clears
  while (lo < hi){ const k = (lo + hi) >> 1; if (gap(k) >= D) hi = k; else lo = k + 1; }
  const dt = lo*D/gap(lo)/1000;                           // gap grows in step with Δt, so scale to land exactly on D
  return { dt, rate:1/dt };
}
const PROJ = {
  id:'proj', group:'Shooter', title:'Projectile',

  docs(){ return `

with drag and/or backspin lift (ambcalc's model):
