<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calc Workshop — prototype v2</title>
<!--
  Calc Workshop — prototype v2  (v2 adds: Chain & Belt C-C calculator)
  ----------------------------------------------------------------
  One self-contained file: open it in any browser, no build step.
  Layout:   top bar (units / copy link / reset) + left menu + calculator page.
  Code map (search for these headings):
    1. UNITS        – how values are stored (always metric "base" units) and displayed
    2. STATE + URL  – what the page remembers, and how Copy Link works
    3. PLOT HELPERS – tiny canvas plotting helpers (no chart library)
    4. CALCULATORS  – each calculator is one object: inputs, compute(), renderOut(), docs
    5. PAGE         – builds the menu, form and page, wires up events
-->
<style>
  :root{
    --bg:#f6f5f0; --card:#ffffff; --ink:#1c1e22; --muted:#6b6f76; --line:#e4e2da;
    --accent:#2f9c90; --accent-soft:#e3f2ef;
    --panel:#222a38; --panel-ink:#c9d1de; --grid:#344055;
    --green:#4cc38a; --red:#e5534b; --blue:#4f8df5; --purple:#a77bf3; --orange:#f0a43a;
    --warn-bg:#fff6e5; --warn-ink:#8a5a00;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif}
  button,input,select{font:inherit;color:inherit}

  /* ---------- top bar ---------- */
  .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;height:56px;padding:0 18px;
    background:rgba(246,245,240,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .brand{font-weight:800;letter-spacing:-.02em;font-size:18px;display:flex;align-items:center;gap:8px}
  .brand .dot{width:12px;height:12px;border-radius:3px;background:var(--accent)}
  .brand small{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.04em}
  .spacer{flex:1}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
  .seg button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--muted)}
  .seg button.on{background:var(--ink);color:#fff}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer}
  .btn:hover{border-color:#cfccc0}
  .btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ---------- layout ---------- */
  .layout{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 56px)}
  .sidebar{border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
  .sidebar h4{margin:16px 10px 6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .sidebar h4:first-child{margin-top:0}
  .navitem{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;
    padding:7px 10px;border-radius:7px;cursor:pointer}
  .navitem:hover{background:#ecebe4}
  .navitem.on{background:var(--accent-soft);color:#17695f;font-weight:600}
  .navitem[disabled]{color:#a9aaa6;cursor:default;background:none}
  .navitem .soon{font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:0 5px}
  main{padding:28px 32px 60px;min-width:0;max-width:1280px}

  /* ---------- page header ---------- */
  .eyebrow{color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
  h1{font-size:44px;line-height:1.05;letter-spacing:-.035em;margin:6px 0 8px;font-weight:800}
  .lede{color:var(--muted);font-size:17px;max-width:720px;margin:0 0 22px}

  /* ---------- calculator body ---------- */
  .calc{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .form .sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
  .form .sec:first-child{margin-top:0;padding-top:0;border-top:0}
  .field{display:grid;grid-template-columns:1fr 128px;align-items:center;gap:8px;margin:6px 0}
  .field label{font-size:14px}
  .field .help{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-4px}
  .inbox{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;background:#fbfbf9;overflow:hidden}
  .inbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .inbox input,.inbox select{border:0;background:none;padding:6px 8px;width:100%;min-width:0;outline:none}
  .inbox .unit{padding:0 8px;color:var(--muted);font-size:12px;white-space:nowrap}
  .field.check{grid-template-columns:auto 1fr}
  .field.check input{width:16px;height:16px;accent-color:var(--accent)}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .tile .k{font-size:12px;color:var(--muted)}
  .tile .v{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .tile.primary{background:var(--ink);border-color:var(--ink);color:#fff}
  .tile.primary .k{color:#b8bcc4}
  .warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:14px}

  .panels{display:grid;gap:12px}
  .panels.two{grid-template-columns:1fr 1fr}
  .panels.shot{grid-template-columns:1.7fr 1fr}
  figure.panel{margin:0;background:var(--panel);border-radius:12px;padding:10px 12px 12px;color:var(--panel-ink);min-width:0}
  figure.panel figcaption{font-size:12px;letter-spacing:.06em;color:#9aa6b8;margin-bottom:6px}
  figure.panel svg{display:block;width:100%;height:240px}
  figure.panel canvas{display:block;width:100%;height:340px}
  .readout{background:#151b26;border-radius:8px;padding:10px 12px;margin-top:10px;font-size:13px;line-height:1.7;font-variant-numeric:tabular-nums}
  .readout b{font-weight:600}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#9aa6b8;margin-top:8px}
  .legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

  details.adv{margin-top:14px}
  details.adv summary{cursor:pointer;font-weight:600}
  table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{font-size:12px;color:var(--muted);font-weight:600}
  td.mono,code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
  .pass{color:#17803d;font-weight:600}.fail{color:#c0392b;font-weight:600}

  /* ---------- docs ---------- */
  .docs{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .docs h3{margin:0 0 8px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .docs .eq{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:#f3f2ec;border-radius:8px;padding:10px 12px;line-height:1.8;white-space:pre-wrap}
  .docs p,.docs li{font-size:14px}
  .docs ul{padding-left:18px}
  footer{color:var(--muted);font-size:12px;margin-top:40px}

  table.dark th{color:#9aa6b8;border-color:#344055} table.dark td{border-color:#344055;color:#c9d1de}
  table.dark tr.now td{color:#fff;font-weight:700;background:rgba(79,141,245,.18)}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;transition:.2s;
    background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:14px;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%)}

  /* ---------- small screens ---------- */
  @media (max-width:1100px){ .calc{grid-template-columns:1fr} .panels.shot{grid-template-columns:1fr} }
  @media (max-width:820px){
    .layout{grid-template-columns:1fr}
    .sidebar{position:static;height:auto;display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px}
    .sidebar h4{display:none}
    .navitem{width:auto;white-space:nowrap}
    .navitem[disabled]{display:none}
    main{padding:20px 16px 48px}
    h1{font-size:32px}
    .panels.two,.docs{grid-template-columns:1fr}
    .brand small{display:none}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span>Calc Workshop <small>PROTOTYPE v2</small></div>
  <div class="spacer"></div>
  <div class="seg" id="unitSeg">
    <button data-u="imperial">Imperial</button><button data-u="metric">Metric</button>
  </div>
  <button class="btn" id="copyBtn" title="Copy a link with every input filled in">Copy link</button>
  <button class="btn" id="resetBtn" title="Put this calculator back to its defaults">Reset</button>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="main"></main>
</div>
<div id="toast"></div>

<script>
/* =================================================================
   1. UNITS
   Every value is STORED in metric base units (mm, m, m/s, kg).
   We only convert when SHOWING a number or READING what you typed.
   Each kind: [label, factor-to-base, decimals]
   ================================================================= */
const KINDS = {
  lenS:  { metric:['mm',1,2],     imperial:['in',25.4,4] },        // small lengths (sheet metal, wheels)
  len:   { metric:['m',1,3],      imperial:['ft',0.3048,3] },      // field distances
  speed: { metric:['m/s',1,2],    imperial:['ft/s',0.3048,2] },
  mass:  { metric:['kg',1,3],     imperial:['lb',0.45359237,3] },
  deg:   { metric:['°',1,1],      imperial:['°',1,1] },
  rpm:   { metric:['rpm',1,0],    imperial:['rpm',1,0] },
  pct:   { metric:['%',1,0],      imperial:['%',1,0] },
  teeth: { metric:['T',1,0],      imperial:['T',1,0] },
  none:  { metric:['',1,3],       imperial:['',1,3] },
  s:     { metric:['s',1,3],      imperial:['s',1,3] },
};
const U       = k => KINDS[k][state.units];
const toDisp  = (v,k) => v / U(k)[1];
const toBase  = (v,k) => v * U(k)[1];
const round   = (x,d) => Number.isFinite(x) ? Number(x.toFixed(d)) : x;
const fmtNum  = (x,d) => Number.isFinite(x) ? x.toFixed(d) : '—';
const fmtK    = (v,k,extra=0) => `${fmtNum(toDisp(v,k), U(k)[2]+extra)} ${U(k)[0]}`.trim();
const fmtSign = (v,k) => (v>=0?'+':'−') + fmtNum(Math.abs(toDisp(v,k)), U(k)[2]);

/* =================================================================
   2. STATE + URL
   state.values[calcId][inputKey] = value in base units.
   The URL hash mirrors the state, so "Copy link" just copies the URL.
   ================================================================= */
const state = { calc:'bend', units:'imperial', values:{} };

function defaultsFor(calc){
  const v = {};
  calc.inputs.forEach(i => { if (i.key) v[i.key] = i.def; });
  return v;
}
function writeHash(){
  const q = new URLSearchParams({ c: state.calc, u: state.units });
  const vals = state.values[state.calc];
  for (const [k,v] of Object.entries(vals)){
    q.set(k, typeof v === 'boolean' ? (v?'1':'0') : typeof v === 'number' ? String(+v.toPrecision(7)) : v);
  }
  history.replaceState(null, '', '#' + q.toString());
}
function readHash(){
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.get('u') === 'metric' || q.get('u') === 'imperial') state.units = q.get('u');
  const calc = CALCS.find(c => c.id === q.get('c'));
  if (!calc) return;
  state.calc = calc.id;
  const vals = state.values[calc.id];
  calc.inputs.forEach(i => {
    if (!i.key || !q.has(i.key)) return;
    const raw = q.get(i.key);
    if (i.type === 'check') vals[i.key] = raw === '1';
    else if (i.type === 'select') vals[i.key] = raw;
    else if (Number.isFinite(parseFloat(raw))) vals[i.key] = parseFloat(raw);
  });
}

/* =================================================================
   3. PLOT HELPERS (canvas)
   frame() draws the dark panel + grid and returns X()/Y() functions
   that turn base-unit values into pixel positions.
   ================================================================= */
const COL = {
  panel:'#222a38', grid:'#344055', axis:'#8794a8', text:'#9aa6b8',
  green:'#4cc38a', red:'#e5534b', blue:'#4f8df5', purple:'#a77bf3', orange:'#f0a43a', white:'#e9edf3'
};
function niceTicks(a, b, n=6){
  const span = b - a; if (!(span > 0)) return [a];
  const raw = span / n, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1,2,2.5,5,10].map(f => f*mag).find(s => span/s <= n) || 10*mag;
  const out = []; for (let t = Math.ceil(a/step)*step; t <= b + 1e-9; t += step) out.push(+t.toFixed(10));
  return out;
}
function frame(cv, xr, yr, xKind, yKind, xLabel, yLabel){
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  const c = cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  const m = { l:48, r:12, t:12, b:38 };
  c.fillStyle = COL.panel; c.fillRect(0,0,W,H);
  const X = v => m.l + (v - xr[0]) / (xr[1]-xr[0]) * (W - m.l - m.r);
  const Y = v => H - m.b - (v - yr[0]) / (yr[1]-yr[0]) * (H - m.t - m.b);
  c.font = '11px -apple-system,Segoe UI,sans-serif'; c.lineWidth = 1;
  // grid lines are placed at "nice" numbers in DISPLAY units, then mapped back to base units
  const fx = xKind ? U(xKind)[1] : 1, fy = yKind ? U(yKind)[1] : 1;
  niceTicks(xr[0]/fx, xr[1]/fx).forEach(t => {
    const px = X(t*fx); c.strokeStyle = COL.grid; c.beginPath(); c.moveTo(px, m.t); c.lineTo(px, H-m.b); c.stroke();
    c.fillStyle = COL.text; c.textAlign = 'center'; c.fillText(String(t), px, H - m.b + 14);
  });
  niceTicks(yr[0]/fy, yr[1]/fy, 5).forEach(t => {
    const py = Y(t*fy); c.strokeStyle = COL.grid; c.beginPath(); c.moveTo(m.l, py); c.lineTo(W-m.r, py); c.stroke();
    c.fillStyle = COL.text; c.textAlign = 'right'; c.fillText(String(t), m.l - 6, py + 4);
  });
  c.fillStyle = COL.text; c.textAlign = 'center';
  c.fillText(xLabel, m.l + (W-m.l-m.r)/2, H - 6);
  c.save(); c.translate(12, m.t + (H-m.t-m.b)/2); c.rotate(-Math.PI/2); c.fillText(yLabel, 0, 0); c.restore();
  return { c, X, Y, W, H, m };
}
function polyline(c, pts, X, Y){
  c.beginPath(); pts.forEach((p,i) => i ? c.lineTo(X(p[0]), Y(p[1])) : c.moveTo(X(p[0]), Y(p[1]))); c.stroke();
}
function star(c, x, y, r){
  c.beginPath();
  for (let i=0;i<10;i++){ const a = -Math.PI/2 + i*Math.PI/5, rr = i%2 ? r*0.45 : r; c.lineTo(x+rr*Math.cos(a), y+rr*Math.sin(a)); }
  c.closePath(); c.fill(); c.stroke();
}
const tile = (k, v, cls='') => `<div class="tile ${cls}"><div class="k">${k}</div><div class="v">${v}</div></div>`;

/* =================================================================
   4. CALCULATORS
   Each calculator = { id, group, title, lede, inputs[], compute(v), renderOut(el,v,r), docs() }
   compute() is pure math on base units — easy to test on its own.
   ================================================================= */

/* ---------- 4a. Sheet metal bend ---------- */
const MATERIALS = {
  // Starting K-factors only — real values come from your shop / vendor test bends.
  al5052: { label:'Aluminum 5052-H32', k:0.43 },
  al6061: { label:'Aluminum 6061-T6',  k:0.45 },
  steel:  { label:'Mild steel (CRS)',  k:0.44 },
  ss304:  { label:'Stainless 304',     k:0.45 },
  custom: { label:'Custom',            k:0.44 },
};
const BEND = {
  id:'bend', group:'Fabrication', title:'Sheet Metal Bend', num:'01',
  lede:'Flat length, bend-line placement, bend allowance and bend deduction for a single bend. Flange lengths are outside (mold-line) dimensions.',
  inputs:[
    {section:'Material'},
    {key:'material', label:'Material', type:'select', def:'al5052',
      options:Object.entries(MATERIALS).map(([v,m]) => ({value:v, label:m.label}))},
    {key:'thickness', label:'Thickness (T)', kind:'lenS', def:3.175},
    {key:'k', label:'K-factor', kind:'none', def:0.43, help:'Where the neutral axis sits, as a fraction of T from the inside.'},
    {section:'Bend'},
    {key:'radius', label:'Inside radius (R)', kind:'lenS', def:3.175},
    {key:'angle', label:'Bend angle (θ)', kind:'deg', def:90, help:'How far the flange is bent: 90° makes an L.'},
    {section:'Part'},
    {key:'flangeA', label:'Flange A (outside)', kind:'lenS', def:50.8},
    {key:'flangeB', label:'Flange B (outside)', kind:'lenS', def:25.4},
    {key:'width', label:'Part width', kind:'lenS', def:76.2},
  ],
  onChange(key, v){ if (key === 'material' && v.material !== 'custom') v.k = MATERIALS[v.material].k; },
  compute(v){
    const T = v.thickness, R = v.radius, K = v.k, th = v.angle * Math.PI/180;
    const BA   = th * (R + K*T);                 // arc length of the neutral axis
    const OSSB = Math.tan(th/2) * (R + T);       // outside setback: tangent point → mold-line corner
    const BD   = 2*OSSB - BA;                    // how much shorter the flat is than A + B
    const flat = v.flangeA + v.flangeB - BD;
    const bendStart  = v.flangeA - OSSB;         // measured from the flange-A edge of the flat
    const bendCenter = bendStart + BA/2;
    const bendEnd    = bendStart + BA;
    const warnings = [];
    if (!(v.angle > 0 && v.angle < 180)) warnings.push('Bend angle must be between 0° and 180°.');
    if (bendStart <= 0) warnings.push('Flange A is shorter than the outside setback — the bend would start past the edge.');
    if (v.flangeB - OSSB <= 0) warnings.push('Flange B is shorter than the outside setback.');
    if (R < 0.5*T) warnings.push('Inside radius is under half the thickness — check your tooling and material can do this.');
    if (K < 0.2 || K > 0.5) warnings.push('K-factor is usually between about 0.3 and 0.5.');
    return { T, R, K, th, BA, OSSB, BD, flat, bendStart, bendCenter, bendEnd, warnings };
  },
  renderOut(el, v, r){
    const rows = [
      ['Outside setback (OSSB)', `tan(θ/2)·(R+T) = tan(${fmtNum(v.angle/2,1)}°)·(${fmtK(r.R,'lenS')} + ${fmtK(r.T,'lenS')})`, fmtK(r.OSSB,'lenS')],
      ['Neutral axis offset', `K·T = ${fmtNum(r.K,3)} · ${fmtK(r.T,'lenS')}`, fmtK(r.K*r.T,'lenS')],
      ['Bend allowance (BA)', `θ·(R + K·T) = ${fmtNum(r.th,4)} rad · ${fmtK(r.R + r.K*r.T,'lenS')}`, fmtK(r.BA,'lenS')],
      ['Bend deduction (BD)', `2·OSSB − BA`, fmtK(r.BD,'lenS')],
      ['Flat length', `A + B − BD`, fmtK(r.flat,'lenS')],
      ['Bend zone starts', `A − OSSB (from edge A)`, fmtK(r.bendStart,'lenS')],
      ['Bend zone ends', `start + BA`, fmtK(r.bendEnd,'lenS')],
      ['Outside radius', `R + T`, fmtK(r.R + r.T,'lenS')],
    ];
    el.innerHTML = `
      <div class="tiles">
        ${tile('Flat length', fmtK(r.flat,'lenS'), 'primary')}
        ${tile('Bend line from edge A', fmtK(r.bendCenter,'lenS'))}
        ${tile('Bend deduction', fmtK(r.BD,'lenS'))}
        ${tile('Bend allowance', fmtK(r.BA,'lenS'))}
      </div>
      ${r.warnings.map(w => `<div class="warn">⚠ ${w}</div>`).join('')}
      <div class="panels two">
        <figure class="panel"><figcaption>FORMED PART · θ = ${fmtNum(v.angle,1)}°</figcaption>${profileSVG(v, r)}</figure>
        <figure class="panel"><figcaption>FLAT PATTERN · bend line dashed</figcaption>${flatSVG(v, r)}</figure>
      </div>
      <details class="adv card"><summary>Advanced details — every step with your numbers</summary>
        <table><tr><th>Quantity</th><th>Formula</th><th>Value</th></tr>
        ${rows.map(x => `<tr><td>${x[0]}</td><td class="mono">${x[1]}</td><td class="mono">${x[2]}</td></tr>`).join('')}
        </table>
      </details>`;
  },
  validation(){
    // Hand calculation (worked in the docs): 1/16" sheet, R = 1/16", 90°, K = 0.44, A = B = 1"
    const v = { thickness:1.5875, radius:1.5875, k:0.44, angle:90, flangeA:25.4, flangeB:25.4 };
    const r = this.compute(v);
    return [
      { name:'Bend allowance', expected:0.141372, got:r.BA/25.4, unit:'in', tol:1e-4 },
      { name:'Bend deduction', expected:0.108628, got:r.BD/25.4, unit:'in', tol:1e-4 },
      { name:'Flat length',    expected:1.891372, got:r.flat/25.4, unit:'in', tol:1e-4 },
    ];
  },
  docs(){ return `
    <div><h3>How it works</h3>
      <p>When sheet metal bends, the inside squeezes and the outside stretches. Somewhere in between is the <b>neutral axis</b>, which keeps its length. The K-factor says where it sits: <code>K·T</code> in from the inside face.</p>
      <div class="eq">BA   = θ · (R + K·T)          ← length of neutral axis in the bend
OSSB = tan(θ/2) · (R + T)       ← outside setback
BD   = 2·OSSB − BA              ← bend deduction

function profileSVG(v, r){

  if (maxy - miny < span*0.35){ const c=(maxy+miny)/2; miny = c - span*0.175; maxy = c + span*0.175; }

    <text x="${midA[0]}" y="${fs*1.9}" fill="${COL.white}" font-size="${fs}" text-anchor="middle">A = ${fmtK(A,'lenS')}</text>
    <text x="${midB[0]+nB[0]*fs*1.6}" y="${-(midB[1]+nB[1]*fs*1.6)}" fill="${COL.white}" font-size="${fs}" text-anchor="start">B = ${fmtK(B,'lenS')}</text>
  </svg>`;
}
function flatSVG(v, r){

/* ---------- 4b. Shot trajectory ---------- */
const G = 9.80665, RHO = 1.225;
function makeSim(p){
  // k = drag constant: a_drag = −k·|v|·v   (from F = ½·ρ·Cd·A·v²)
  const area = Math.PI * (p.diam/1000/2)**2;
  const k = p.drag ? 0.5*RHO*p.cd*area/p.mass : 0;
  const acc = (vx, vy) => { const s = Math.hypot(vx, vy); return [-k*s*vx, -G - k*s*vy]; };
  // Returns where the ball crosses the target height on the way DOWN (x = −∞ if it never does).
  return function sim(angDeg, v, record){
    const a = angDeg*Math.PI/180, dt = 0.004;
    let x = 0, y = p.h0, vx = v*Math.cos(a), vy = v*Math.sin(a), t = 0, apex = y;
    const pts = record ? [[x,y]] : null;
    for (let i = 0; i < 3000; i++){
      // one Runge-Kutta (RK4) step — a more accurate way to step the motion forward than x += v·dt
      const [ax1,ay1] = acc(vx,vy);
      const vx2 = vx+ax1*dt/2, vy2 = vy+ay1*dt/2; const [ax2,ay2] = acc(vx2,vy2);
      const vx3 = vx+ax2*dt/2, vy3 = vy+ay2*dt/2; const [ax3,ay3] = acc(vx3,vy3);
      const vx4 = vx+ax3*dt,   vy4 = vy+ay3*dt;   const [ax4,ay4] = acc(vx4,vy4);
      const nx  = x  + dt/6*(vx +2*vx2+2*vx3+vx4), ny  = y  + dt/6*(vy +2*vy2+2*vy3+vy4);
      const nvx = vx + dt/6*(ax1+2*ax2+2*ax3+ax4), nvy = vy + dt/6*(ay1+2*ay2+2*ay3+ay4);
      if (ny > apex) apex = ny;
      if (nvy < 0 && y >= p.H && ny < p.H){
        const f = (y - p.H)/(y - ny), xc = x + f*(nx - x);
        if (record) pts.push([xc, p.H]);
        return { x:xc, t:t + f*dt, apex, pts, hit:true };
      }
      x = nx; y = ny; vx = nvx; vy = nvy; t += dt;
      if (record) pts.push([x,y]);
      if (vy < 0 && y < p.H) break;   // falling and already below the target: it will never get there
    }
    return { x:-Infinity, t, apex, pts, hit:false };
  };
}
function bisect(f, lo, hi, target, iters=32){
  // f is increasing in its argument; find arg where f(arg) = target
  if (f(hi) < target) return null;
  if (f(lo) >= target) return lo;
  for (let i=0;i<iters;i++){ const mid=(lo+hi)/2; if (f(mid) < target) lo = mid; else hi = mid; }
  return (lo+hi)/2;
}
const SHOT = {
  id:'shot', group:'Shooter', title:'Shot Trajectory', num:'02',
  lede:'Every launch angle and speed that drops the ball into the goal, and the single shot most tolerant of your shooter’s speed and angle errors.',
  inputs:[
    {section:'Geometry'},
    {key:'h0', label:'Release height', kind:'len', def:0.6096},
    {key:'dist', label:'Distance to goal center', kind:'len', def:3.9624},
    {key:'H', label:'Goal height', kind:'len', def:1.8288},
    {key:'w', label:'Goal opening (front to back)', kind:'len', def:1.0668},
    {key:'ceiling', label:'Max ball height (0 = none)', kind:'len', def:0},
    {section:'Search'},
    {key:'amin', label:'Min launch angle', kind:'deg', def:25},
    {key:'amax', label:'Max launch angle', kind:'deg', def:80},
    {key:'sv', label:'Speed error (1σ)', kind:'speed', def:0.1524, help:'How far your flywheel speed typically drifts.'},
    {key:'sa', label:'Angle error (1σ)', kind:'deg', def:1.0, help:'How far your hood angle typically drifts.'},
    {section:'Air drag'},
    {key:'drag', label:'Include air drag', type:'check', def:false},
    {key:'mass', label:'Ball mass', kind:'mass', def:0.215, showIf:v=>v.drag},
    {key:'diam', label:'Ball diameter', kind:'lenS', def:150, showIf:v=>v.drag},
    {key:'cd', label:'Drag coefficient (Cd)', kind:'none', def:0.47, showIf:v=>v.drag, help:'0.47 is a smooth sphere — a placeholder until you measure your ball.'},
  ],
  compute(v){
    const p = { ...v };
    const sim = makeSim(p);
    const near = v.dist - v.w/2, far = v.dist + v.w/2;
    const warnings = [];
    if (v.w <= 0) warnings.push('Goal opening must be larger than zero.');
    if (v.amax <= v.amin) warnings.push('Max angle must be larger than min angle.');
    // For each launch angle: the slowest shot that lands at the near lip (red) and the fastest at the far lip (green).
    const rows = [];
    const step = 1;
    for (let a = Math.ceil(v.amin); a <= v.amax + 1e-9; a += step){
      const land = s => sim(a, s).x;
      let lo = bisect(land, 0.2, 60, near), hi = bisect(land, 0.2, 60, far);
      if (lo !== null && hi !== null && v.ceiling > 0){
        const vc = bisect(s => sim(a, s).apex, 0.2, 60, v.ceiling);
        if (vc !== null) hi = Math.min(hi, vc);
      }
      rows.push((lo !== null && hi !== null && hi > lo) ? { a, lo, hi } : { a, lo:null, hi:null });
    }
    // Score each angle: how many "standard errors" of margin does the middle speed have?
    const margin = (row, s) => row.lo === null ? -Infinity : Math.min(s - row.lo, row.hi - s);
    let best = null;
    rows.forEach((row, i) => {
      if (row.lo === null) return;
      const s = (row.lo + row.hi)/2, sTol = (row.hi - row.lo)/2;
      // angle tolerance at this speed: walk to neighbours while still inside, then interpolate the edge

        let j = i;

        const n = rows[j+dir], mj = margin(rows[j], s);
        if (!n || !Number.isFinite(margin(n, s))) return rows[j].a;
        const mn = margin(n, s); return rows[j].a + dir*step*mj/(mj - mn);

      const aLo = edge(-1), aHi = edge(1);

      if (!best || score > best.score) best = { a:row.a, s, sTol, aLo, aHi, score };

    if (best){

    return { rows, best, curves, near, far, warnings };
  },
  renderOut(el, v, r){

      </div>
      ${r.warnings.map(w => `<div class="warn">⚠ ${w}</div>`).join('')}

        <figure class="panel"><figcaption>TRAJECTORIES · side view</figcaption><canvas id="cvTraj"></canvas>
          <div class="legend"><span><i style="background:${COL.green}"></i>fastest shot that scores</span>
            <span><i style="background:${COL.red}"></i>slowest shot that scores</span>
            <span><i style="background:${COL.blue}"></i>most robust shot</span></div></figure>
        <figure class="panel"><figcaption>VALID SHOT REGION · angle vs speed</figcaption><canvas id="cvRegion"></canvas>
          <div class="readout">${b ? `
            <span style="color:${COL.blue}"><b>Optimal:</b> ${fmtNum(b.a,1)}° @ ${fmtK(b.s,'speed')}</span><br>
            <span style="color:${COL.orange}"><b>Speed:</b> ${fmtSign(-b.sTol,'speed')} / ${fmtSign(b.sTol,'speed')} ${U('speed')[0]}</span><br>
            <span style="color:${COL.purple}"><b>Angle:</b> −${fmtNum(b.a-b.aLo,1)}° / +${fmtNum(b.aHi-b.a,1)}°</span><br>
            <span><b>Margin:</b> ${fmtNum(b.score,1)} σ before a miss</span>` : 'No valid shot.'}</div></figure>

  validation(){

    const base = { h0:1, H:1, drag:false, mass:1, diam:100, cd:0 };
    const sim = makeSim(base);
    return [
      { name:'45°, 7 m/s', expected:49*Math.sin(Math.PI/2)/G, got:sim(45,7).x, unit:'m', tol:1e-3 },

function drawTraj(cv, v, r){
  let ymax = Math.max(v.H, v.h0) * 1.15;
  r.curves.forEach(c => c.hi.concat(c.lo).forEach(p => { if (p[1] > ymax) ymax = p[1]; }));
  if (v.ceiling > 0) ymax = Math.max(ymax, v.ceiling*1.05);
  ymax = Math.min(ymax*1.05, Math.max(v.H, v.h0)*4 + 2);
  const xmax = r.far * 1.12;
  const { c, X, Y, W, H, m } = frame(cv, [0, xmax], [0, ymax], 'len', 'len', `Distance (${U('len')[0]})`, `Height (${U('len')[0]})`);
  c.save(); c.beginPath(); c.rect(m.l, m.t, W-m.l-m.r, H-m.t-m.b); c.clip();
  c.lineWidth = 1; c.globalAlpha = 0.55;
  r.curves.forEach(cv => { c.strokeStyle = COL.red; polyline(c, cv.lo, X, Y); c.strokeStyle = COL.green; polyline(c, cv.hi, X, Y); });
  c.globalAlpha = 1;
  // goal height line, goal opening, front wall
  c.setLineDash([5,4]); c.strokeStyle = 'rgba(229,83,75,.6)'; c.beginPath(); c.moveTo(X(0), Y(v.H)); c.lineTo(X(xmax), Y(v.H)); c.stroke();
  if (v.ceiling > 0){ c.strokeStyle = 'rgba(167,123,243,.7)'; c.beginPath(); c.moveTo(X(0), Y(v.ceiling)); c.lineTo(X(xmax), Y(v.ceiling)); c.stroke(); }
  c.setLineDash([]);
  c.strokeStyle = COL.red; c.lineWidth = 2.5; c.beginPath(); c.moveTo(X(r.near), Y(0)); c.lineTo(X(r.near), Y(v.H)); c.stroke();
  c.strokeStyle = COL.green; c.lineWidth = 5; c.beginPath(); c.moveTo(X(r.near), Y(v.H)); c.lineTo(X(r.far), Y(v.H)); c.stroke();
  if (r.best){ c.strokeStyle = COL.blue; c.lineWidth = 3; polyline(c, r.best.pts, X, Y); }
  c.fillStyle = COL.white; c.beginPath(); c.arc(X(0), Y(v.h0), 4, 0, 7); c.fill();
  c.restore();
}
function drawRegion(cv, v, r){
  const valid = r.rows.filter(x => x.lo !== null);
  if (!valid.length){ frame(cv, [v.amin, v.amax], [0, 10], null, 'speed', 'Launch angle (°)', `Speed (${U('speed')[0]})`); return; }
  let smin = Math.min(...valid.map(x => x.lo)), smax = Math.max(...valid.map(x => x.hi));
  const pad = (smax - smin)*0.12 + 0.05;
  const amin = valid[0].a - 2, amax = valid[valid.length-1].a + 2;
  const { c, X, Y } = frame(cv, [amin, amax], [smin-pad, smax+pad], null, 'speed', 'Launch angle (°)', `Speed (${U('speed')[0]})`);
  // fill between the red and green limits
  c.fillStyle = 'rgba(76,195,138,.18)'; c.beginPath();
  valid.forEach((x,i) => i ? c.lineTo(X(x.a), Y(x.hi)) : c.moveTo(X(x.a), Y(x.hi)));
  valid.slice().reverse().forEach(x => c.lineTo(X(x.a), Y(x.lo))); c.closePath(); c.fill();
  c.lineWidth = 2;
  c.strokeStyle = COL.green; polyline(c, valid.map(x => [x.a, x.hi]), X, Y);
  c.strokeStyle = COL.red;   polyline(c, valid.map(x => [x.a, x.lo]), X, Y);
  [['hi',COL.green],['lo',COL.red]].forEach(([k,col]) => { c.fillStyle = col; valid.forEach(x => { c.beginPath(); c.arc(X(x.a), Y(x[k]), 2.2, 0, 7); c.fill(); }); });
  const b = r.best; if (!b) return;
  c.strokeStyle = COL.purple; c.lineWidth = 2.5; c.beginPath(); c.moveTo(X(b.aLo), Y(b.s)); c.lineTo(X(b.aHi), Y(b.s)); c.stroke();

      <div class="eq">stage ratio  = driven teeth / driver teeth
total ratio  = stage1 × stage2 × stage3
output rpm   = motor rpm / total ratio
surface speed = output rpm / 60 × π × wheel diameter</div>
      <p>Pulleys and sprockets work the same way — just use tooth counts.</p>
    </div>
    <div><h3>Validation</h3>${validationTable(this)}</div>`; }
};

/* ---------- 4d. Chain / belt center distance ---------- */
const DRIVES = {
  // p = pitch (mm). u = belt pitch-line offset (mm): how far the belt's pitch line sits outside the pulley OD.
  c25:   { label:'#25 chain',      kind:'chain', p:6.35 },
  c35:   { label:'#35 chain',      kind:'chain', p:9.525 },
  gt2:   { label:'GT2 3 mm belt',  kind:'belt',  p:3, u:0.381 },
  htd5:  { label:'HTD 5 mm belt',  kind:'belt',  p:5, u:0.5715 },
  cchain:{ label:'Custom chain',   kind:'chain', p:null },
  cbelt: { label:'Custom belt',    kind:'belt',  p:null, u:0 },
};
// Chain length in pitches for center distance c (in pitches) — the textbook (Shigley) chain formula
const chainLenP = (c, N1, N2) => 2*c + (N1+N2)/2 + ((N2-N1)/(2*Math.PI))**2 / c;
// Belt length (mm) on the pitch circles for center distance C — exact open-belt geometry
function beltLen(C, D1, D2){
  const big = Math.max(D1,D2), small = Math.min(D1,D2), phi = Math.asin((big-small)/(2*C));
  return 2*C*Math.cos(phi) + Math.PI*(big+small)/2 + phi*(big-small);
}
function beltGeom(v){
  const d = DRIVES[v.drive], chain = d.kind === 'chain', p = v.pitch;
  const N1 = Math.round(v.n1), N2 = Math.round(v.n2);
  // pitch diameter: chain sits on a polygon, a belt wraps a smooth circle
  const pd = N => chain ? p/Math.sin(Math.PI/N) : N*p/Math.PI;
  const od = N => chain ? p*(0.6 + 1/Math.tan(Math.PI/N)) : N*p/Math.PI - 2*(d.u || 0);
  const D1 = pd(N1), D2 = pd(N2);
  const k = ((N2-N1)/(2*Math.PI))**2;
  const lenP = C => chain ? chainLenP(C/p, N1, N2) : beltLen(C, D1, D2)/p;   // length in pitches
  const Cmin = Math.max(Math.abs(D1-D2)/2 + 1e-9, chain ? p*Math.sqrt(k/2) + 1e-9 : 0);
  // Method 1 (what the calculator uses): numerically find C where the length equals L pitches
  const solveC = L => {
    if (!(L > 0) || lenP(Cmin) > L) return null;
    let lo = Cmin, hi = L*p;
    for (let i = 0; i < 80; i++){ const mid = (lo+hi)/2; if (lenP(mid) < L) lo = mid; else hi = mid; }
    return (lo+hi)/2;
  };
  return { d, chain, p, N1, N2, D1, D2, od1:od(N1), od2:od(N2), k, lenP, solveC };
}
const BELT = {
  id:'belt', group:'Power Transmission', title:'Chain & Belt C-C', num:'04',
  lede:'Pick a chain or timing belt, two sprockets or pulleys, and either a target center distance or a link/tooth count. Get the exact center-to-center distance, the nearest real sizes, and a fit check.',
  inputs:[
    {section:'Drive'},
    {key:'drive', label:'Chain / belt', type:'select', def:'gt2',
      options:Object.entries(DRIVES).map(([v,d]) => ({value:v, label:d.label}))},
    {key:'pitch', label:'Pitch', kind:'lenS', def:3},
    {key:'n1', label:'Sprocket / pulley 1', kind:'teeth', def:18},
    {key:'n2', label:'Sprocket / pulley 2', kind:'teeth', def:36},
    {section:'Solve'},
    {key:'mode', label:'Solve by', type:'select', def:'cc',
      options:[{value:'cc', label:'Target C-C distance'}, {value:'count', label:'Link / tooth count'}]},
    {key:'target', label:'Target C-C', kind:'lenS', def:101.6, showIf:v => v.mode === 'cc'},
    {key:'round', label:'Round', type:'select', def:'nearest', showIf:v => v.mode === 'cc',
      options:[{value:'nearest', label:'Nearest'}, {value:'up', label:'Up (longer)'}, {value:'down', label:'Down (shorter)'}]},
    {key:'count', label:'Belt teeth / chain links', kind:'teeth', def:100, showIf:v => v.mode === 'count'},
    {key:'step', label:'Count step', kind:'teeth', def:1, help:'Chain: 2 keeps an even link count (no half link). Belts: use 5 if your supplier only stocks every 5 teeth.'},
    {key:'adder', label:'C-C adder', kind:'lenS', def:0, help:'Extra spacing added to the answer, if your team adds some for tension. 0 = exact.'},
  ],
  onChange(key, v){
    if (key !== 'drive') return;
    const d = DRIVES[v.drive];
    if (d.p) v.pitch = d.p;
    v.step = d.kind === 'chain' ? 2 : 1;
  },
  compute(v){
    const g = beltGeom(v), warnings = [];
    const step = Math.max(1, Math.round(v.step));
    if (g.N1 < 8 || g.N2 < 8) warnings.push('Very small sprocket/pulley — under 8 teeth is unusual.');
    let count, targetCount = null;
    if (v.mode === 'cc'){
      targetCount = g.lenP(Math.max(v.target, 1e-6));
      const fn = { nearest:Math.round, up:Math.ceil, down:Math.floor }[v.round];
      count = fn(targetCount/step)*step;
    } else count = Math.round(v.count);
    const C = g.solveC(count);
    if (C === null){ warnings.push('That chain/belt is too short to wrap these two sprockets/pulleys.'); return { g, count, warnings, C:null }; }
    const phi = Math.asin(Math.abs(g.D1-g.D2)/(2*C));
    const wrapSmall = Math.PI - 2*phi, nSmall = Math.min(g.N1, g.N2);
    const inMesh = nSmall * wrapSmall/(2*Math.PI);
    const clearance = C - (g.od1 + g.od2)/2;
    if (clearance < 0) warnings.push('The sprockets/pulleys overlap at this center distance.');
    if (g.chain && count % 2) warnings.push('Odd link count — you would need an offset (half) link.');
    if (!g.chain && inMesh < 6) warnings.push(`Only ${inMesh.toFixed(1)} teeth in mesh on the small pulley — a common rule of thumb is at least 6, or the belt may skip.`);
    const nearby = [];
    for (let i = -3; i <= 3; i++){ const n = count + i*step, c = g.solveC(n); if (n > 0 && c !== null) nearby.push({ n, C:c + v.adder, now:i === 0 }); }
    return { g, count, targetCount, C, Cf:C + v.adder, length:count*g.p, wrapSmall, inMesh, clearance, nearby, warnings };
  },
  renderOut(el, v, r){
    const g = r.g, noun = g.chain ? 'links' : 'teeth';
    if (r.C === null){ el.innerHTML = r.warnings.map(w => `<div class="warn">⚠ ${w}</div>`).join(''); return; }
    const delta = v.mode === 'cc' ? r.Cf - v.target : null;
    el.innerHTML = `
      <div class="tiles">
        ${tile(g.chain ? 'Chain size' : 'Belt size', `${r.count} ${noun}`, 'primary')}
        ${tile('C-C distance', fmtK(r.Cf,'lenS'), 'primary')}
        ${delta !== null ? tile('Change from target', fmtSign(delta,'lenS') + ' ' + U('lenS')[0]) : ''}
        ${tile(g.chain ? 'Chain length' : 'Belt pitch length', fmtK(r.length,'lenS'))}
        ${tile('Clearance between ODs', fmtK(r.clearance,'lenS'))}
      </div>
      ${r.warnings.map(w => `<div class="warn">⚠ ${w}</div>`).join('')}
      <div class="panels two">
        <figure class="panel"><figcaption>LAYOUT · pitch circles dashed, outside diameters solid</figcaption>${beltSVG(r)}</figure>
        <figure class="panel"><figcaption>NEARBY SIZES</figcaption>
          <table class="dark"><tr><th>${g.chain ? 'Links' : 'Belt teeth'}</th><th>C-C</th>${v.mode === 'cc' ? '<th>vs target</th>' : ''}</tr>
          ${r.nearby.map(n => `<tr class="${n.now ? 'now' : ''}"><td>${n.n}${g.chain && n.n % 2 ? ' <span title="needs offset link">*</span>' : ''}</td>
            <td class="mono">${fmtK(n.C,'lenS')}</td>${v.mode === 'cc' ? `<td class="mono">${fmtSign(n.C - v.target,'lenS')}</td>` : ''}</tr>`).join('')}
          </table></figure>
      </div>
      <details class="adv card"><summary>Advanced details</summary>
        <table><tr><th>Quantity</th><th>Formula</th><th>Value</th></tr>
          <tr><td>Pitch diameter 1 / 2</td><td class="mono">${g.chain ? 'p / sin(180°/N)' : 'N·p / π'}</td><td class="mono">${fmtK(g.D1,'lenS')} / ${fmtK(g.D2,'lenS')}</td></tr>
          <tr><td>Outside diameter 1 / 2</td><td class="mono">${g.chain ? 'p·(0.6 + cot(180°/N))' : 'PD − 2·(pitch-line offset)'}</td><td class="mono">${fmtK(g.od1,'lenS')} / ${fmtK(g.od2,'lenS')}</td></tr>
          ${r.targetCount !== null ? `<tr><td>Exact length at target C-C</td><td class="mono">before rounding</td><td class="mono">${r.targetCount.toFixed(3)} ${noun}</td></tr>` : ''}
          <tr><td>Wrap on small ${g.chain ? 'sprocket' : 'pulley'}</td><td class="mono">180° − 2·asin((D−d)/2C)</td><td class="mono">${(r.wrapSmall*180/Math.PI).toFixed(1)}°</td></tr>
          <tr><td>Teeth in mesh (small)</td><td class="mono">N_small · wrap / 360°</td><td class="mono">${r.inMesh.toFixed(1)}</td></tr>
          <tr><td>Exact C-C (before adder)</td><td class="mono">solved numerically</td><td class="mono">${fmtK(r.C,'lenS',1)}</td></tr>
        </table>
      </details>`;
  },
  validation(){
    const solve = (drive, p, n1, n2, count) => beltGeom({ drive, pitch:p, n1, n2 }).solveC(count);
    // Shigley's closed-form inverse of the chain length formula
    const shigley = (p, N1, N2, L) => { const A = (N1+N2)/2 - L, k = ((N2-N1)/(2*Math.PI))**2; return p/4*(-A + Math.sqrt(A*A - 8*k)); };
    // Common belt approximation: L ≈ 2C + π(D+d)/2 + (D−d)²/4C, solved for C
    const approx = (D, d, L) => { const b = 4*L - 2*Math.PI*(D+d); return (b + Math.sqrt(b*b - 32*(D-d)**2))/16; };
    const D18 = 18*3/Math.PI, D48 = 48*3/Math.PI;
    return [
      { name:'#25 chain 16T/16T, 60 links (exact: (60−16)/2 · p)', expected:(60-16)/2*6.35, got:solve('c25',6.35,16,16,60), unit:'mm', tol:1e-6 },
      { name:'#25 chain 15T/42T, 80 links (Shigley closed form)',  expected:shigley(6.35,15,42,80), got:solve('c25',6.35,15,42,80), unit:'mm', tol:1e-6 },
      { name:'GT2 36T/36T, 150T belt (exact: (150−36)/2 · p)',     expected:(150-36)/2*3, got:solve('gt2',3,36,36,150), unit:'mm', tol:1e-6 },
      { name:'GT2 18T/48T, 150T belt (approx. formula, ±0.1 mm)',   expected:approx(D48,D18,450), got:solve('gt2',3,18,48,150), unit:'mm', tol:0.1 },
    ];
  },
  docs(){ return `
    <div><h3>How it works</h3>
      <p><b>Chain</b> (the textbook formula, e.g. Shigley's <i>Mechanical Engineering Design</i>), with C in pitches:</p>
      <div class="eq">L = 2C + (N1+N2)/2 + ((N2−N1)/2π)² / C</div>
      <p><b>Timing belt</b> — exact geometry on the pitch circles, PD = N·p/π:</p>
      <div class="eq">φ = asin((D−d) / 2C)
L = 2C·cos φ + π(D+d)/2 + φ·(D−d)</div>
      <p>The calculator finds the length at your target C-C, rounds it to a real link or tooth count, then searches (bisection) for the C-C that gives exactly that length.</p>
    </div>
    <div><h3>Validation — two methods must agree</h3>
      <ul>
        <li>Equal sprockets/pulleys have an exact answer: C = (L − N)/2 · p.</li>
        <li>The chain formula can be rearranged into a closed form (Shigley) — the numeric solver must match it.</li>
        <li>For unequal belts, the common approximation formula should land within 0.1 mm.</li>
      </ul>
      ${validationTable(this)}
    </div>`; }
};

function beltSVG(r){
  // Pulley 1 at (0,0), pulley 2 at (C,0). Belt follows the pitch circles; outer tangent lines join them.
  const g = r.g, C = r.C, r1 = g.D1/2, r2 = g.D2/2, o1 = g.od1/2, o2 = g.od2/2;
  const a = Math.acos(Math.max(-1, Math.min(1, (r1 - r2)/C)));   // angle of the tangent points
  const pts = [];
  for (let i = 0; i <= 60; i++){ const t = a + (2*Math.PI - 2*a)*i/60; pts.push([r1*Math.cos(t), r1*Math.sin(t)]); }
  for (let i = 0; i <= 60; i++){ const t = -a + 2*a*i/60; pts.push([C + r2*Math.cos(t), r2*Math.sin(t)]); }
  const path = 'M' + pts.map(p => `${p[0].toFixed(3)},${(-p[1]).toFixed(3)}`).join(' L') + ' Z';
  const R = Math.max(r1, r2, o1, o2), w = C + Math.max(r1,o1) + Math.max(r2,o2), fs = Math.max(w, 2*R)*0.05;
  const x0 = -Math.max(r1,o1) - fs, y0 = -R - fs, W = w + 2*fs, H = 2*R + fs*4.5, sw = Math.max(w, 2*R)*0.004;
  const yd = R + fs*1.6;
  return `<svg viewBox="${x0} ${y0} ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <circle cx="0" cy="0" r="${o1}" fill="rgba(79,141,245,.12)" stroke="${COL.blue}" stroke-width="${sw}"/>
    <circle cx="${C}" cy="0" r="${o2}" fill="rgba(79,141,245,.12)" stroke="${COL.blue}" stroke-width="${sw}"/>
    <circle cx="0" cy="0" r="${r1}" fill="none" stroke="${COL.text}" stroke-width="${sw*0.7}" stroke-dasharray="${fs*0.3} ${fs*0.25}"/>
    <circle cx="${C}" cy="0" r="${r2}" fill="none" stroke="${COL.text}" stroke-width="${sw*0.7}" stroke-dasharray="${fs*0.3} ${fs*0.25}"/>
    <path d="${path}" fill="none" stroke="${COL.green}" stroke-width="${sw*2.5}" stroke-linejoin="round"/>
    <text x="0" y="${fs*0.35}" fill="${COL.white}" font-size="${fs}" text-anchor="middle">${g.N1}T</text>
    <text x="${C}" y="${fs*0.35}" fill="${COL.white}" font-size="${fs}" text-anchor="middle">${g.N2}T</text>
    <line x1="0" y1="${yd}" x2="${C}" y2="${yd}" stroke="${COL.orange}" stroke-width="${sw}"/>
    <line x1="0" y1="${yd-fs*0.4}" x2="0" y2="${yd+fs*0.4}" stroke="${COL.orange}" stroke-width="${sw}"/>
    <line x1="${C}" y1="${yd-fs*0.4}" x2="${C}" y2="${yd+fs*0.4}" stroke="${COL.orange}" stroke-width="${sw}"/>
    <text x="${C/2}" y="${yd+fs*1.3}" fill="${COL.orange}" font-size="${fs}" text-anchor="middle">C-C ${fmtK(r.Cf,'lenS')}</text>
  </svg>`;
}

const CALCS = [BEND, SHOT, GEAR, BELT];
const COMING = [
  ['Power Transmission','Motor Curves'],
  ['Mechanisms','Arm Torque'], ['Mechanisms','Elevator'], ['Shooter','Flywheel Energy'],
];

function validationTable(calc){
  const rows = calc.validation();
  return `<table><tr><th>Case</th><th>Expected</th><th>Calculator</th><th></th></tr>
    ${rows.map(x => { const ok = Math.abs(x.got - x.expected) <= x.tol;
      return `<tr><td>${x.name}</td><td class="mono">${x.expected.toFixed(4)} ${x.unit}</td><td class="mono">${x.got.toFixed(4)} ${x.unit}</td>
        <td class="${ok?'pass':'fail'}">${ok?'✓ pass':'✗ off by '+Math.abs(x.got-x.expected).toExponential(1)}</td></tr>`; }).join('')}</table>`;
}

/* =================================================================
   5. PAGE
   ================================================================= */
const current = () => CALCS.find(c => c.id === state.calc);

function renderSidebar(){
  const groups = [...new Set([...CALCS.map(c => c.group), ...COMING.map(x => x[0])])];
  document.getElementById('sidebar').innerHTML = groups.map(g => `<h4>${g}</h4>` +
    CALCS.filter(c => c.group === g).map(c => `<button class="navitem ${c.id===state.calc?'on':''}" data-calc="${c.id}">${c.title}</button>`).join('') +
    COMING.filter(x => x[0] === g).map(x => `<button class="navitem" disabled>${x[1]}<span class="soon">soon</span></button>`).join('')
  ).join('');
}
function renderForm(){
  const calc = current(), v = state.values[calc.id];
  document.getElementById('form').innerHTML = calc.inputs.map(i => {
    if (i.section) return `<div class="sec">${i.section}</div>`;
    if (i.showIf && !i.showIf(v)) return '';
    const help = i.help ? `<div class="help">${i.help}</div>` : '';
    if (i.type === 'check') return `<div class="field check"><input type="checkbox" id="in_${i.key}" data-key="${i.key}" ${v[i.key]?'checked':''}><label for="in_${i.key}">${i.label}</label></div>`;
    if (i.type === 'select') return `<div class="field"><label for="in_${i.key}">${i.label}</label><div class="inbox"><select id="in_${i.key}" data-key="${i.key}">
      ${i.options.map(o => `<option value="${o.value}" ${o.value===v[i.key]?'selected':''}>${o.label}</option>`).join('')}</select></div>${help}</div>`;
    const shown = round(toDisp(v[i.key], i.kind), U(i.kind)[2] + 1);
    return `<div class="field"><label for="in_${i.key}">${i.label}</label><div class="inbox">
      <input id="in_${i.key}" data-key="${i.key}" type="number" step="any" inputmode="decimal" value="${shown}">
      <span class="unit">${U(i.kind)[0]}</span></div>${help}</div>`;
  }).join('');
}
function renderPage(){
  const calc = current();
  document.title = `${calc.title} — Calc Workshop`;
  document.getElementById('main').innerHTML = `
    <div class="eyebrow">${calc.group} · ${calc.num}</div>
    <h1>${calc.title}.</h1>
    <p class="lede">${calc.lede}</p>
    <div class="calc">
      <div class="card form" id="form"></div>
      <div id="out"></div>
    </div>
    <section class="docs card">${calc.docs()}</section>
    <footer>Prototype v2 · every formula is shown so you can check it by hand · values are starting points, not shop data.</footer>`;
  renderSidebar(); renderForm(); update();
  document.querySelectorAll('#unitSeg button').forEach(b => b.classList.toggle('on', b.dataset.u === state.units));
}
let pending = 0;
function update(){
  // Small delay so typing feels smooth on the heavier shot calculator.
  clearTimeout(pending);
  pending = setTimeout(() => {
    const calc = current(), v = state.values[calc.id];
    calc.renderOut(document.getElementById('out'), v, calc.compute(v));
    writeHash();
  }, 25);
}

// ---- events ----
document.getElementById('sidebar').addEventListener('click', e => {
  const b = e.target.closest('[data-calc]'); if (!b) return;
  state.calc = b.dataset.calc; renderPage(); window.scrollTo({ top:0 });
});
document.getElementById('main').addEventListener('input', e => {
  const key = e.target.dataset.key; if (!key) return;
  const calc = current(), v = state.values[calc.id], def = calc.inputs.find(i => i.key === key);
  if (def.type === 'check') v[key] = e.target.checked;
  else if (def.type === 'select') v[key] = e.target.value;
  else { const n = parseFloat(e.target.value); if (!Number.isFinite(n)) return; v[key] = toBase(n, def.kind); }
  if (calc.onChange) calc.onChange(key, v);
  if (def.type === 'check' || def.type === 'select') renderForm();   // some fields appear/disappear or change
  update();
});
document.getElementById('unitSeg').addEventListener('click', e => {
  const u = e.target.dataset.u; if (!u || u === state.units) return;
  state.units = u; renderPage();
});
document.getElementById('resetBtn').addEventListener('click', () => {
  state.values[state.calc] = defaultsFor(current()); renderPage(); toast('Reset to defaults');
});
document.getElementById('copyBtn').addEventListener('click', async () => {
  writeHash();
  try { await navigator.clipboard.writeText(location.href); }
  catch { const t = document.createElement('textarea'); t.value = location.href; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast('Link copied — it reopens with these exact inputs');
});
let toastTimer;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800); }
window.addEventListener('resize', () => { if (state.calc === 'shot') update(); });

// ---- start ----
CALCS.forEach(c => state.values[c.id] = defaultsFor(c));
readHash();
renderPage();
</script>
